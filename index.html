'use strict';
const KEY='mealplanner-user-v1', RKEY='mealplanner-recipes-v1', DAYS=['Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă','Duminică'], SLOTS=['Mic dejun','Prânz','Cină','Gustare'];
let state=load(KEY,{fast:[2,4],plan:{},checked:{},target:2200}),recipes=load(RKEY,[]),tab='home',chosenDay=0,filter='all',search='',minProtein=0,maxKcal=0,selectedRecipe=null,selectedPortions=1,addDay=0,addSlot='Prânz';
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function saveRecipes(){localStorage.setItem(RKEY,JSON.stringify(recipes))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n,d=0){return Number(n||0).toLocaleString('ro-RO',{maximumFractionDigits:d})}function macros(r){return r.macros||{}}function dayType(d){return state.fast.includes(d)?'post':'normal'}function getRec(id){return recipes.find(x=>x.id===id)}function weeklyDay(d){return state.plan[d]||[]}
function total(d){let z={kcal:0,protein:0,carbs:0,fat:0};for(let e of weeklyDay(d)){let r=getRec(e.id);if(!r)continue;for(let k of Object.keys(z))z[k]+=(Number(macros(r)[k])||0)*(Number(e.eat)||1)}return z}
function statUI(m){return `<div class="stats">${[['kcal','Calorii','kcal'],['protein','Proteine','g'],['carbs','Carbohidrați','g'],['fat','Grăsimi','g']].map(([k,label,unit])=>`<div class="stat"><b>${m[k]==null?'—':fmt(m[k],1)}${m[k]==null?'':`<span class="mini"> ${unit}</span>`}</b><small>${label}</small></div>`).join('')}</div>`}

// Fotografii din arhiva privata, stocate numai in IndexedDB-ul acestui dispozitiv.
const PHOTO_DB='mealplan-photos-v11', PHOTO_STORE='pics';
let photoDbPromise=null,photoUrls=new Map(),photoObserver=null;
function getPhotoDb(){if(photoDbPromise)return photoDbPromise;return photoDbPromise=new Promise((resolve,reject)=>{const q=indexedDB.open(PHOTO_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(PHOTO_STORE))q.result.createObjectStore(PHOTO_STORE)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function getPhotoBlob(path){const db=await getPhotoDb();return new Promise((res,rej)=>{const req=db.transaction(PHOTO_STORE,'readonly').objectStore(PHOTO_STORE).get(path);req.onsuccess=()=>res(req.result||null);req.onerror=()=>rej(req.error)})}

function hydratePhotos(){const imgs=[...document.querySelectorAll('img[data-pic]:not([data-loaded])')];if(!imgs.length)return;if('IntersectionObserver' in window){if(photoObserver)photoObserver.disconnect();photoObserver=new IntersectionObserver(entries=>{for(const en of entries)if(en.isIntersecting){photoObserver.unobserve(en.target);fillOneImage(en.target)}},{rootMargin:'250px'});imgs.forEach(im=>photoObserver.observe(im))}else imgs.forEach(fillOneImage)}
function parseStoreZip(ab){const v=new DataView(ab),data=new Uint8Array(ab),names=new TextDecoder(),entries=new Map();let pos=0;while(pos+30<ab.byteLength&&v.getUint32(pos,true)===0x04034b50){const flags=v.getUint16(pos+6,true),method=v.getUint16(pos+8,true),len=v.getUint32(pos+18,true),nl=v.getUint16(pos+26,true),el=v.getUint16(pos+28,true);if(flags&8||method!==0)throw Error('Arhiva nu are formatul de import așteptat (ZIP fără compresie).');let name=names.decode(data.subarray(pos+30,pos+30+nl));let start=pos+30+nl+el,end=start+len;if(end>ab.byteLength)throw Error('Arhivă incompletă');entries.set(name,{start,end});pos=end}return entries}
async function importPrivatePack(file){if(!file)return;try{
 if(!confirm('Importăm biblioteca completă și fotografiile local pe acest dispozitiv? Planurile existente vor fi păstrate.'))return;
 let buf=await file.arrayBuffer(),entries=parseStoreZip(buf);let rec=entries.get('retete-complete.json');if(!rec)throw Error('Fișierul retete-complete.json lipsește din arhivă.');let x=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,rec.start,rec.end-rec.start)));
 if(!Array.isArray(x)||x.length!==362||!x.every(validateRecipe))throw Error('Biblioteca JSON nu este validă.');let ids=new Set(x.map(r=>r.id));if(ids.size!==362)throw Error('ID-uri duplicate.');
 let imgEntries=[...entries].filter(([name])=>name.startsWith('photos/')||name.startsWith('pages/'));
 if(imgEntries.length!==724)throw Error('Lipsesc fotografii/pagini de verificare: '+imgEntries.length+'/724.');
 let db=await getPhotoDb();await new Promise((res,rej)=>{let tx=db.transaction(PHOTO_STORE,'readwrite'),store=tx.objectStore(PHOTO_STORE);for(const [name,{start,end}] of imgEntries)store.put(new Blob([buf.slice(start,end)],{type:'image/jpeg'}),name);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});
 recipes=x;saveRecipes();for(let u of photoUrls.values())URL.revokeObjectURL(u);photoUrls.clear();alert('Au fost importate '+recipes.length+' rețete și '+imgEntries.length+' fotografii/pagini de referință. Datele sunt locale.');render();

// An ingredient is displayed word-for-word for the original yield. For different yields,
// adjust the quantity only when an unambiguous numerical quantity was extracted.
// The original source text remains in the private JSON and the source-page image.
function ingredientDisplay(i,r,desired){
 const raw=String(i.raw||i.name||'').trim();const base=portionsBase(r);
 if(i.groupHeader||!base||desired===base)return {value:raw,uncertain:false};
 const qty=Number(i.qty);
 if(i.qty!=null&&Number.isFinite(qty)){
   const scaled=qty*desired/base;
   let modified='';
   const leading=/^(\s*(?:\[opțional\]\s*)?)(\d+\/\d+|\d+(?:[.,]\d+)?|½|¼|¾)(?=\s|[a-zA-ZăâîșțĂÂÎȘȚ])/u;
   if(i.unit==='buc')modified=`${formatAmount(scaled)} × ${i.name}`;
   else if(/^(lingură|linguriță|felie|cană|ou)$/i.test(i.unit||'')){const plural={'lingură':'linguri','linguriță':'lingurițe','felie':'felii','cană':'căni','ou':'ouă'};const unit=scaled===1?i.unit:(plural[i.unit.toLowerCase()]||i.unit);modified=`${formatAmount(scaled)} ${unit} ${i.name}`;}
   else if(leading.test(raw))modified=raw.replace(leading,(_all,prefix)=>prefix+formatAmount(scaled));
   else {
     const suffix=/(\d+(?:[.,]\d+)?)\s*(g|gr|kg|ml|l)(?=\b)/i;
     if(suffix.test(raw))modified=raw.replace(suffix,(_all,num,unit)=>formatAmount(scaled)+' '+unit);
   }
   if(!modified)modified=(i.unit==='buc'?`${formatAmount(scaled)} × ${i.name}`:`${formatAmount(scaled)} ${i.unit||''} ${i.name}`).trim();
   // Secondary equivalents such as "2 gălbenușuri (~36 g)" are scaled too;
   // percentages (2% fat), temperatures and times are never changed.
   modified=modified.replace(/\((\s*[~≈]?\s*)(\d+(?:[.,]\d+)?)(\s*(?:g|ml)\b)/gi,(_whole,approx,num,unit)=>'('+approx+formatAmount(Number(num.replace(',','.'))*desired/base)+unit);
   return {value:modified,uncertain:false};
 }
 return {value:raw,uncertain:/\d|½|¼|¾/u.test(raw)};
}

}

let shoppingPendingOnly=false,shopOpen=new Set(['fruits','meat','dairy','grains','legumes','fats','seasoning','other']);
state.favorites=Array.isArray(state.favorites)?state.favorites:[];
const KIND_OPTIONS=[['all','Toate tipurile'],['breakfast','Mic dejun'],['main','Fel principal'],['soup','Supe și ciorbe'],['salad','Salate și gustări'],['dessert','Deserturi']];
const KIND_NAMES={breakfast:'Mic dejun',main:'Fel principal',soup:'Supe și ciorbe',salad:'Salate și gustări',dessert:'Deserturi'};
const SLOT_ICONS={'Mic dejun':'☀️','Prânz':'🍲','Cină':'🌙','Gustare':'🍎'};
function norm(x){return String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('ro').trim()}
// Clasificare orientativă după denumire, nu o afirmație despre clasificarea din carte.
function recipeKind(r){let n=norm(r.name);
 if(/ciorba|supa|bors|supa crema|supa-crema|supă|supă-cremă/.test(n))return 'soup';
 if(/cheesecake|budinca|prajitur|tort|biscuit|chec|brownie|briose|muffin|clatit|gogos|cremsnit|amandin|papanas|cozonac|ciocolat|inghetat|mousse|desert|prajit|terci|granola/.test(n))return 'dessert';
 if(/salata|wrap|sandvis|sandwich|lipie|hummus|humus|guacamole|aperitiv|bruschetta|tartin|pasta de|salată/.test(n))return 'salad';
 if(/omleta|oua|toast|mic dejun|ovaz|overnight|ou posat|fulgi de|scrambled|chia|ou ochi/.test(n))return 'breakfast';
 return 'main';}
function matchesRecipe(r,q,kind='all',time='all'){
 if(kind!=='all'&&recipeKind(r)!==kind)return false;
 if(time!=='all'&&(!Number(r.minutes)||Number(r.minutes)>Number(time)))return false;
 if(!q)return true;
 const h=norm([r.name,...(r.ingredients||[]).filter(i=>!i.groupHeader).map(i=>i.name||i.raw)].join(' '));
 return norm(q).split(/\s+/).every(w=>h.includes(w));
}
function favorite(id){return state.favorites.includes(id)}
function toggleFavorite(id){state.favorites=Array.isArray(state.favorites)?state.favorites:[];state.favorites=favorite(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();if(tab==='recipes')refreshResults();else render();}
function go(t){tab=t;if(t==='recipes'){search='';filter='all';uiKind='all';uiTime='all';uiFavOnly=false;uiSort='az'}render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.getElementById('tabs').innerHTML=[['home','⌂','Acasă'],['recipes','▤','Rețete'],['plan','▦','Plan'],['shopping','▧','Listă'],['settings','⚙','Setări']].map(([k,i,l])=>`<button class="tab ${tab===k?'active':''}" aria-label="${l}" onclick="go('${k}')"><strong>${i}</strong>${l}</button>`).join('');let content=tab==='home'?home():tab==='recipes'?library():tab==='plan'?planner():tab==='shopping'?shopping():settings();document.getElementById('app').innerHTML=`<header><div class="brand">🥗 meal<span>plan</span><div class="eyebrow">rețetele mele • v1.4</div></div><span class="topCounter">${recipes.length} rețete</span></header>`+content;queueMicrotask(hydratePhotos)}
function home(){let sum=total(chosenDay),p=Math.min(100,Math.max(0,100*sum.kcal/Math.max(1,state.target)));
 return `<div class="eyebrow">Organizare simplă, mese mai bune</div><h1>Ce gătim azi? <span class="friendlyEmoji">🥑</span></h1><section class="welcome"><div class="row"><span class="welcomeCaption">Planul alimentar · ${DAYS[chosenDay]}</span><span class="welcomeBubble">${dayType(chosenDay)==='post'?'🌿 De post':'🍽️ Zi normală'}</span></div><div class="welcomeCalories">${fmt(sum.kcal)} <span>/ ${fmt(state.target)} kcal</span></div><div class="progress"><span style="width:${p}%"></span></div>${statUI(sum)}<p class="tiny">Totalul include numai porțiile din meniul zilei selectate.</p></section><div class="sectionHeader"><h2>Alege ziua</h2><button class="textAction" onclick="go('plan')">Vezi planul →</button></div>${daysUI()}<div class="panel"><div class="row"><h2 style="margin:0">Mesele de ${DAYS[chosenDay].toLowerCase()}</h2><span class="chip ${dayType(chosenDay)==='post'?'post':'normal'}">${dayType(chosenDay)==='post'?'🌿 Post':'Normal'}</span></div>${weeklyDay(chosenDay).length?weeklyDay(chosenDay).map(e=>{let r=getRec(e.id);return r?`<div class="homeMeal"><span>${SLOT_ICONS[e.slot]||'🍽️'}</span><div class="grow"><b>${esc(r.name)}</b><div class="tiny">${esc(e.slot)} · ${e.eat} ${e.eat===1?'porție':'porții'}</div></div></div>`:''}).join(''):'<div class="emptyCompact">Încă nu ai ales mesele pentru această zi.</div>'}<button class="btn primary block" onclick="startAdd(${chosenDay},'Prânz')">＋ Adaugă o masă</button></div><div class="homeTiles"><button class="homeTile peach" onclick="go('recipes')"><span>📖</span><b>Descoperă rețete</b><small>Caută după ingredient sau tip</small></button><button class="homeTile lilac" onclick="go('shopping')"><span>🛒</span><b>Lista săptămânii</b><small>Produse grupate pe categorii</small></button></div>`}
function daysUI(){return `<div class="days">${DAYS.map((d,i)=>`<button class="day ${i===chosenDay?'selected':''} ${dayType(i)==='post'?'isFast':''}" onclick="chooseDay(${i})"><b>${d.slice(0,3)}</b><div class="tiny">${dayType(i)==='post'?'🌿 Post':'🍽️ Normal'}</div><small>${weeklyDay(i).length} mese</small></button>`).join('')}</div>`}
function filterTypeBar(current,callback,allowAll=true){return `<div class="filterChips">${(allowAll?[['all','Toate'],['post','🌿 De post'],['normal','🍽️ Normale']]:[['post','🌿 De post']]).map(([id,label])=>`<button class="filterChip ${current===id?'on':''}" onclick="${callback}('${id}')">${label}</button>`).join('')}</div>`}
function setLibraryType(v){filter=v;refreshResults();document.querySelectorAll('.libraryType .filterChip').forEach(x=>x.classList.toggle('on',x.dataset.kind===v))}
function libraryList(){let arr=recipes.filter(r=>(filter==='all'||r.type===filter)&&(!uiFavOnly||favorite(r.id))&&matchesRecipe(r,search,uiKind,uiTime));
 arr.sort((a,b)=>uiSort==='quick'?(Number(a.minutes)||999)-(Number(b.minutes)||999):uiSort==='za'?b.name.localeCompare(a.name,'ro'):uiSort==='favorites'?(Number(favorite(b.id))-Number(favorite(a.id)))||a.name.localeCompare(b.name,'ro'):a.name.localeCompare(b.name,'ro'));
 return arr;}
function library(){return `<div class="eyebrow">Colecția ta personală</div><h1>Descoperă rețete <span class="friendlyEmoji">📚</span></h1><div class="filterPanel"><label class="fieldLabel" for="searchbox">Caută după nume sau ingredient</label><div class="searchWrap"><span>⌕</span><input id="searchbox" class="searchInput" type="search" value="${esc(search)}" placeholder="ex. pui, dovlecel, chia…" oninput="search=this.value;refreshResults()"></div><div class="fieldLabel">Alimentație</div><div class="libraryType filterChips">${[['all','Toate'],['post','🌿 De post'],['normal','🍽️ Normale']].map(([id,label])=>`<button data-kind="${id}" class="filterChip ${filter===id?'on':''}" onclick="setLibraryType('${id}')">${label}</button>`).join('')}</div><div class="filterGrid"><label class="fieldLabel">Tip de preparat <select class="field compact" onchange="uiKind=this.value;refreshResults()">${KIND_OPTIONS.map(([id,label])=>`<option value="${id}" ${id===uiKind?'selected':''}>${label}</option>`).join('')}</select></label><label class="fieldLabel">Timp de pregătire <select class="field compact" onchange="uiTime=this.value;refreshResults()"><option value="all">Oricât</option>${[15,30,45,60].map(n=>`<option value="${n}" ${uiTime===String(n)?'selected':''}>Până la ${n} min</option>`).join('')}</select></label><label class="fieldLabel">Ordonează <select class="field compact" onchange="uiSort=this.value;refreshResults()"><option value="az" ${uiSort==='az'?'selected':''}>Alfabetic A–Z</option><option value="za" ${uiSort==='za'?'selected':''}>Alfabetic Z–A</option><option value="quick" ${uiSort==='quick'?'selected':''}>Cele mai rapide</option><option value="favorites" ${uiSort==='favorites'?'selected':''}>Favorite întâi</option></select></label><label class="favoriteSwitch"><input type="checkbox" class="checkbox" ${uiFavOnly?'checked':''} onchange="uiFavOnly=this.checked;refreshResults()"> ♡ Doar favorite</label></div><p class="filterHint">Tipurile de preparate sunt sugestii bazate pe denumire, nu categorii din PDF.</p></div><div id="recipeResults">${resultsHTML(libraryList())}</div>`}
function resultsHTML(arr){return `<div class="resultsHeading"><b>${arr.length} ${arr.length===1?'rețetă găsită':'rețete găsite'}</b><span>Apasă pe o rețetă pentru detalii</span></div><div class="recipesGrid">${arr.map(r=>`<article class="recipeCard"><button class="recipeCardMain" onclick="openRecipe('${esc(r.id)}')">${r.photo?`<img class="recipeCardPhoto" src="${PLACEHOLDER_PIC}" data-pic="${esc(r.photo)}" alt="Fotografia rețetei ${esc(r.name)}" loading="lazy">`:'<div class="recipeCardPhoto placeholder">🍲</div>'}<div class="recipeCardBody"><div class="row"><span class="chip ${r.type==='post'?'post':'normal'}">${r.type==='post'?'🌿 Post':'🍽️ Normal'}</span><span class="mini">${r.minutes?'⏱ '+r.minutes+' min':''}</span></div><h3>${esc(r.name)}</h3><div class="recipeFoot"><span>${r.portions?`🍴 ${portionText(r.portions)}`:'🍴 porții neprecizate'}</span><span>${macros(r).kcal!=null?`~${fmt(macros(r).kcal)} kcal / porție`:''}</span></div></div></button><button class="favButton ${favorite(r.id)?'active':''}" aria-label="${favorite(r.id)?'Elimină de la favorite':'Adaugă la favorite'}" title="Favorite" onclick="toggleFavorite('${esc(r.id)}')">${favorite(r.id)?'♥':'♡'}</button></article>`).join('')}</div>${!arr.length?'<div class="empty">Nu am găsit rețete. Încearcă un alt ingredient sau relaxează filtrele.</div>':''}`}
function refreshResults(){let target=document.getElementById('recipeResults');if(!target)return;target.innerHTML=resultsHTML(libraryList());queueMicrotask(hydratePhotos)}
function planner(){let sum=total(chosenDay),cnt=weeklyDay(chosenDay).length;
 return `<div class="eyebrow">Planul tău pe 7 zile</div><h1>Planificator <span class="friendlyEmoji">🗓️</span></h1><p class="sub">Alege o zi, marcheaz-o ca zi de post și adaugă mesele prin căutare.</p>${daysUI()}<div class="dayPlanHeader ${dayType(chosenDay)==='post'?'fastBg':''}"><div class="row"><div><span class="tiny">MENIUL ZILEI</span><h2 style="margin:4px 0">${DAYS[chosenDay]}</h2><span class="tiny">${cnt} ${cnt===1?'masă planificată':'mese planificate'}</span></div><label class="fastToggle"><input class="checkbox" type="checkbox" ${dayType(chosenDay)==='post'?'checked':''} onchange="toggleFast(${chosenDay},this.checked)"> 🌿 Zi de post</label></div><div class="dayTotal"><span>🍽️ Totalul zilei</span><b>${fmt(sum.kcal)} kcal</b><small>${fmt(sum.protein,1)} g proteine</small></div></div>${SLOTS.map(s=>`<section class="mealSlot"><div class="mealSlotHeader"><div class="row start"><div class="mealIcon">${SLOT_ICONS[s]}</div><b>${s}</b></div><button class="slotAdd" onclick="startAdd(${chosenDay},'${s}')">＋ Adaugă</button></div>${weeklyDay(chosenDay).map((e,i)=>{if(e.slot!==s)return '';let r=getRec(e.id);return r?`<div class="planRecipe">${r.photo?`<img src="${PLACEHOLDER_PIC}" data-pic="${esc(r.photo)}" alt="" loading="lazy">`:'<div class="planPlaceholder">🍽️</div>'}<div class="grow"><button class="recipeInline" onclick="openRecipe('${esc(r.id)}')">${esc(r.name)}</button><div class="mini">${e.eat} ${Number(e.eat)===1?'porție':'porții'} · ${fmt(e.eat*Number(macros(r).kcal||0))} kcal</div>${dayType(chosenDay)==='post'&&r.type!=='post'?'<span class="badQA">⚠️ Nepotrivit pentru zi de post</span>':''}</div><button class="removeMeal" aria-label="Elimină masa" onclick="removeMeal(${chosenDay},${i})">×</button></div>`:''}).join('')||'<p class="slotEmpty">Nu ai ales încă o rețetă.</p>'}</section>`).join('')}`}
function startAdd(d,slot='Prânz',prefId=null){addDay=d;addSlot=slot;pickerSearch='';pickerKind='all';pickerType=dayType(d)==='post'?'post':'all';pickedRecipeId=prefId;showAdd()}
function startAddRecipe(id){hideModal();startAdd(chosenDay,'Prânz',id)}
function pickerRecipes(){let arr=recipes.filter(r=>(dayType(addDay)!=='post'||r.type==='post')&&(pickerType==='all'||r.type===pickerType)&&matchesRecipe(r,pickerSearch,pickerKind));arr.sort((a,b)=>a.name.localeCompare(b.name,'ro'));return arr}
function pickerResults(){let arr=pickerRecipes();return `<div class="pickerCount">${arr.length} rețete · selectează una${arr.length>50?' (afișate primele 50)':''}</div><div class="pickerGrid">${arr.slice(0,50).map(r=>`<button class="pickerCard ${pickedRecipeId===r.id?'chosen':''}" onclick="selectPickerRecipe('${esc(r.id)}')">${r.photo?`<img src="${PLACEHOLDER_PIC}" data-pic="${esc(r.photo)}" alt="" loading="lazy">`:'<span class="pickerPlaceholder">🍲</span>'}<span class="pickerText"><b>${esc(r.name)}</b><small>${r.type==='post'?'🌿 De post':'🍽️ Normal'} ${r.minutes?'· ⏱ '+r.minutes+' min':''}</small></span><span class="pickerChoose">${pickedRecipeId===r.id?'✓':'＋'}</span></button>`).join('')}</div>${!arr.length?'<div class="empty">Nicio rețetă găsită. Caută alt preparat sau ingredient.</div>':''}`}
function pickerSelected(){let r=getRec(pickedRecipeId);if(!r)return '<div class="pickerUnselected">👆 Alege o rețetă din rezultate pentru a continua.</div>';return `<div class="pickerSelected"><div class="row start"><span>✅</span><div class="grow"><b>${esc(r.name)}</b><div class="tiny">${fmt(macros(r).kcal)} kcal · ${fmt(macros(r).protein,1)} g proteine / porție</div></div></div><div class="portionPicker"><label for="eatPortions">Porții pe care le vei consuma</label><div class="row"><button class="btn ghost" onclick="stepEat(-0.5)">−</button><input id="eatPortions" type="number" min="0.5" max="100" step="0.5" value="1" oninput="updatePickerButton()"><button class="btn ghost" onclick="stepEat(0.5)">＋</button></div></div><button id="pickerConfirm" class="btn primary block" onclick="confirmAdd()">Adaugă în plan →</button></div>`}
function showAdd(){document.getElementById('modal').innerHTML=`<div class="modalWrap" onclick="closeModal(event)"><div class="modal pickerModal" onclick="event.stopPropagation()"><div class="row"><div><div class="eyebrow">${DAYS[addDay]} ${dayType(addDay)==='post'?'· 🌿 zi de post':''}</div><h2 style="margin:4px 0 14px">Alege o rețetă 🍽️</h2></div><button class="btn ghost" onclick="hideModal()" aria-label="Închide">✕</button></div><label class="fieldLabel">Pentru ce masă?</label><select class="field compact" id="addSlot">${SLOTS.map(s=>`<option ${s===addSlot?'selected':''}>${s}</option>`).join('')}</select><label class="fieldLabel" for="pickerQuery">Caută rețeta sau ingredientul</label><div class="searchWrap"><span>⌕</span><input id="pickerQuery" class="searchInput" type="search" placeholder="Ex. pui, salată, dovlecel..." value="${esc(pickerSearch)}" oninput="pickerSearch=this.value;refreshPicker()"></div>${dayType(addDay)==='post'?'<div class="notice fastNotice">🌿 Această zi permite doar rețete de post.</div>':`<div class="filterChips"><button class="filterChip ${pickerType==='all'?'on':''}" onclick="setPickerType('all')">Toate</button><button class="filterChip ${pickerType==='post'?'on':''}" onclick="setPickerType('post')">🌿 De post</button><button class="filterChip ${pickerType==='normal'?'on':''}" onclick="setPickerType('normal')">🍽️ Normale</button></div>`}<label class="fieldLabel">Tip preparat <select id="pickerKind" class="field compact" onchange="pickerKind=this.value;refreshPicker()">${KIND_OPTIONS.map(([id,label])=>`<option value="${id}" ${pickerKind===id?'selected':''}>${label}</option>`).join('')}</select></label><div id="pickerResults">${pickerResults()}</div><div id="pickerSelected">${pickerSelected()}</div></div></div>`;queueMicrotask(hydratePhotos)}
function setPickerType(type){pickerType=type;showAdd();let input=document.getElementById('pickerQuery');if(input)input.focus()}
function refreshPicker(){let p=document.getElementById('pickerResults');if(!p)return;p.innerHTML=pickerResults();queueMicrotask(hydratePhotos)}
function selectPickerRecipe(id){pickedRecipeId=id;let prior=document.getElementById('eatPortions')?.value||'1';document.getElementById('pickerResults').innerHTML=pickerResults();document.getElementById('pickerSelected').innerHTML=pickerSelected();if(document.getElementById('eatPortions'))document.getElementById('eatPortions').value=prior;queueMicrotask(hydratePhotos)}
function stepEat(delta){let el=document.getElementById('eatPortions');if(!el)return;el.value=String(Math.max(.5,Math.min(100,(Number(el.value)||1)+delta)));updatePickerButton()}
function updatePickerButton(){let b=document.getElementById('pickerConfirm'),n=Number(document.getElementById('eatPortions')?.value);if(b)b.disabled=!(n>0&&n<=100)}
function confirmAdd(){let id=pickedRecipeId,eat=Number(document.getElementById('eatPortions')?.value),r=getRec(id);if(!r||!Number.isFinite(eat)||eat<=0||eat>100)return alert('Alege o rețetă și un număr valid de porții.');if(dayType(addDay)==='post'&&r.type!=='post')return alert('Această zi este de post.');(state.plan[addDay]??=[]).push({id,eat,slot:document.getElementById('addSlot').value});save();hideModal();tab='plan';chosenDay=addDay;render()}
const SHOP_CATS=[['vegetables','🥬','Legume și verdețuri'],['fruits','🍓','Fructe'],['meat','🍗','Carne și pește'],['dairy','🥚','Lactate, ouă și alternative vegetale'],['grains','🍞','Cereale și panificație'],['legumes','🫘','Leguminoase și tofu'],['fats','🥑','Uleiuri, nuci și semințe'],['seasoning','🧂','Condimente și sosuri'],['other','🛍️','Altele']];
function ingredientCategory(name){let n=norm(name);
 if(/pui|curcan|vita|porc|carne|somon|ton|peste|cod|merluciu|sardine|crevet|sunca|bacon|ficat|ficate|nisetru|scrumbie|piept de rata|pastrav|macrou/.test(n))return 'meat';
 if(/iaurt|branza|lapte|smantana|mozzarella|cheddar|cascaval|parmezan|unt(?! de (arahide|migdale))|oua|oul|ou |galbenus|albus|chefir|kefir|ricotta|cottage/.test(n))return 'dairy';
 if(/cartof|ceapa|cepe|usturoi|morcov|ardei|rosie|tomat|castrav|varza|dovle|broccoli|conopid|spanac|salata verde|sfecla|vinete|telina|praz|loboda|patrunjel|marar|ciuperc|mazare verde|sparanghel|fasole verde|ridich|gulie|salată verde|rucola|porumb/.test(n))return 'vegetables';
 if(/mar(?!ar)|mere|banana|fruct|afine|capsun|zmeur|mango|ananas|portocal|lamaie|lime|kiwi|para|piersic|prun|curmale|visine|cirese|pepene/.test(n))return 'fruits';
 if(/tofu|linte|naut|fasole (boabe|alba|rosie|neagra)|boabe de fasole|edamame|soia|soia texturata|tempeh|hummus/.test(n))return 'legumes';
 if(/faina|orez|paste|spaghet|ovaz|fulgi|paine|lipie|wrap|pesmet|biscuit|cuscus|quinoa|bulgur|gris|foietaj|malai|tortilla|taitei|h risca|hrisca/.test(n))return 'grains';
 if(/ulei|semin|nuc|migdale|arahid|alune|fistic|caju|avocado|tahini|chia|susan|unt de (arahide|migdale)/.test(n))return 'fats';
 if(/sare|piper|boia|scortisoar|cimbru|busuioc|oregano|otet|mustar|sos |sosul|miere|vanilie|indulcitor|cacao|paprika|ghimbir|condiment|sirop|extract|zeama|coaja rasa|drojdie|praf de copt|curcuma|chimen/.test(n))return 'seasoning';
 return 'other';}
function aggregateShopping(){let map=new Map();for(let d=0;d<7;d++)for(let e of weeklyDay(d)){let r=getRec(e.id);if(!r)continue;for(let i of r.ingredients||[]){if(i.groupHeader)continue;let name=String(i.name||i.raw||'').trim(),unit=String(i.unit||'').trim(),key=(name+'|'+unit).toLowerCase().trim();if(!name)continue;let a=map.get(key)||{key,name,unit,qty:0,unknown:false,cat:ingredientCategory(name)};let q=Number(i.qty);if(i.qty!=null&&Number.isFinite(q)&&Number(r.portions)>0)a.qty+=q*Number(e.eat)/(Number(r.portions));else a.unknown=true;map.set(key,a)}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ro'))}
function formatShopQuantity(i){let q=i.qty>0?fmt(i.qty,2)+' '+esc(i.unit||'buc.'):'';if(i.unknown)return (q?q+' + ':'')+'verifică rețeta';return q||'după gust'}
function shopping(){let all=aggregateShopping(),count=all.filter(i=>state.checked[i.key]).length,display=all.filter(i=>!shoppingPendingOnly||!state.checked[i.key]);let sections=SHOP_CATS.map(([id,emoji,label])=>({id,emoji,label,items:display.filter(i=>i.cat===id),all:all.filter(i=>i.cat===id)})).filter(s=>s.items.length);return `<div class="eyebrow">Pregătită automat din meniul săptămânii</div><h1>Lista de cumpărături <span class="friendlyEmoji">🛒</span></h1><div class="shopSummary"><div class="row"><div><span class="tiny">PROGRESUL TĂU</span><div class="bigProgress">${count} <small>/ ${all.length} produse bifate</small></div></div><div class="shopSummaryIcon">🧺</div></div><div class="progress"><span style="width:${all.length?count/all.length*100:0}%"></span></div><p class="tiny">Am grupat ingredientele pe raioane. Cantitățile sunt calculate pentru porțiile planificate.</p></div><div class="shopTools"><label class="favoriteSwitch"><input type="checkbox" class="checkbox" ${shoppingPendingOnly?'checked':''} onchange="shoppingPendingOnly=this.checked;render()"> Arată doar ce lipsește</label><button class="btn ghost" onclick="clearChecks()">Resetează bifele</button></div>${sections.map(s=>`<details class="shopSection" ${!shopOpen.has(s.id)?'open':''} ontoggle="rememberShopSection('${s.id}',this.open)"><summary><div class="row start"><span class="shopEmoji">${s.emoji}</span><div><b>${s.label}</b><div class="mini">${s.all.filter(x=>state.checked[x.key]).length}/${s.all.length} bifate</div></div></div><span class="sectionCount">${s.items.length} <span class="chevron">⌄</span></span></summary><div class="shopBody">${s.items.map(i=>`<label class="shopItem ${state.checked[i.key]?'done':''}"><input type="checkbox" class="checkbox" ${state.checked[i.key]?'checked':''} onchange="checkItem('${encodeURIComponent(i.key)}',this.checked)"><span class="shopName">${esc(i.name)}</span><span class="shopQty ${i.unknown?'needsReview':''}">${formatShopQuantity(i)}</span></label>`).join('')}</div></details>`).join('')}${!all.length?'<div class="empty">Adaugă rețete în planificator ca să generezi lista.</div>':!display.length?'<div class="empty">🎉 Ai bifat toate produsele!</div>':''}<button class="btn primary block" ${!all.length?'disabled':''} onclick="copyShopping()">📋 Copiază lista de cumpărături</button><p class="filterHint">Ingredientele cu cantități neclare sunt marcate „verifică rețeta”, nu estimate automat.</p>`}

function ingredientTextForHome(r){

/* MealPlan v1.5 — calendar real, jurnal, analiza, progres personal, navigatie, teme. */
const V15_NAV=[['home','⌂','Acasă'],['recipes','▤','Rețete'],['plan','▦','Planificator'],['shopping','🧺','Cumpărături'],['analysis','▥','Analiză mese'],['weight','⚖','Greutate'],['photos','▧','Poze progres'],['settings','⚙','Setări']];
const V15_THEMES=[['mint','🌿','Mentă'],['ocean','🌊','Ocean'],['coral','🌺','Coral'],['lavender','💜','Lavandă'],['sunset','🍊','Apus'],['slate','🪨','Ardezie']];
let chosenDate='',drawerOpen=false,analysisRange=14,weightRange='all',photoUrlCache=new Map(),progressPhotoDBPromise=null;
const PROGRESS_DB='mealplan-personal-progress-v15',PROGRESS_STORE='photos';
function localIso(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parseIso(x){let p=String(x).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function validIso(x){if(!/^\d{4}-\d\d-\d\d$/.test(String(x)))return false;let d=parseIso(x);return !Number.isNaN(d.getTime())&&localIso(d)===x}
function plusDate(x,n){let d=parseIso(x);d.setDate(d.getDate()+n);return localIso(d)}
function weekStart(x){let d=parseIso(x);let offset=(d.getDay()+6)%7;d.setDate(d.getDate()-offset);return localIso(d)}
function dayIndex(x){return (parseIso(x).getDay()+6)%7}
function idxDate(i){return plusDate(weekStart(chosenDate),i)}
function shortDate(x){return new Intl.DateTimeFormat('ro-RO',{day:'numeric',month:'short'}).format(parseIso(x))}
function longDate(x){return new Intl.DateTimeFormat('ro-RO',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(parseIso(x))}
function migrationV15(){
 state=state&&typeof state==='object'?state:{};
 state.planByDate=state.planByDate&&typeof state.planByDate==='object'?state.planByDate:{};
 state.fastByDate=state.fastByDate&&typeof state.fastByDate==='object'?state.fastByDate:{};
 state.weights=Array.isArray(state.weights)?state.weights:[];
 state.progressPhotos=Array.isArray(state.progressPhotos)?state.progressPhotos:[];
 state.shopByWeek=state.shopByWeek&&typeof state.shopByWeek==='object'?state.shopByWeek:{};
 if(!state.calendarMigratedV15 && Object.keys(state.checked||{}).length)state.shopByWeek[weekStart(localIso())]={...state.checked};
 state.visual=state.visual&&typeof state.visual==='object'?state.visual:{palette:'mint',mode:'light'};
 state.fast=Array.isArray(state.fast)?state.fast:[2,4];
 // Planul vechi folosea indicii 0...6. Nu se poate deduce data istorica, asa ca il atasam o singura data saptamanii primei deschideri.
 if(!state.calendarMigratedV15){const w=weekStart(localIso());for(let i=0;i<7;i++){let old=(state.plan||{})[i];let date=plusDate(w,i);if(Array.isArray(old)&&old.length&&!state.planByDate[date])state.planByDate[date]=old.map(e=>({...e,eaten:!!e.eaten}));}state.calendarMigratedV15=true;}
 chosenDate=validIso(state.lastChosenDate)?state.lastChosenDate:localIso();
 // Deschidem mereu ziua curenta, daca ultima vizita a fost in alta zi, fara a pierde vreun plan.
 if(state.lastSeenDate!==localIso())chosenDate=localIso();
 state.lastSeenDate=localIso();state.lastChosenDate=chosenDate;
 switchShoppingWeek();applyVisual(false);save();
}
function save(){if(!chosenDate)return localStorage.setItem(KEY,JSON.stringify(state));state.lastChosenDate=chosenDate;state.shopByWeek=state.shopByWeek||{};state.shopByWeek[weekStart(chosenDate)]=state.checked||{};localStorage.setItem(KEY,JSON.stringify(state));}
function dayType(d){const date=typeof d==='string'&&validIso(d)?d:idxDate(Number(d));return Object.prototype.hasOwnProperty.call(state.fastByDate,date)?(state.fastByDate[date]?'post':'normal'):(state.fast.includes(dayIndex(date))?'post':'normal')}
function weeklyDay(d){const date=typeof d==='string'&&validIso(d)?d:idxDate(Number(d));return state.planByDate[date]||[]}
function total(d){const out={kcal:0,protein:0,carbs:0,fat:0};for(const e of weeklyDay(d)){const r=getRec(e.id);if(!r)continue;for(const k of Object.keys(out))out[k]+=(Number(macros(r)[k])||0)*(Number(e.eat)||1)}return out}
function consumedTotal(date){const out={kcal:0,protein:0,carbs:0,fat:0};for(const e of weeklyDay(date)){if(!e.eaten)continue;let r=getRec(e.id);if(!r)continue;for(const k of Object.keys(out))out[k]+=(Number(macros(r)[k])||0)*(Number(e.eat)||1)}return out}
function switchShoppingWeek(){let k=weekStart(chosenDate);state.shopByWeek=state.shopByWeek||{};state.checked=state.shopByWeek[k]||{};}
function chooseDate(date){if(!validIso(date))return;let oldWeek=weekStart(chosenDate);state.shopByWeek[oldWeek]=state.checked||{};chosenDate=date;chosenDay=dayIndex(date);switchShoppingWeek();save();render()}

function aggregateShopping(){let map=new Map();for(let i=0;i<7;i++)for(let e of weeklyDay(i)){let r=getRec(e.id);if(!r)continue;for(let it of r.ingredients||[]){if(it.groupHeader)continue;let name=String(it.name||it.raw||'').trim(),unit=String(it.unit||'').trim(),key=(name+'|'+unit).toLowerCase().trim();if(!name)continue;let a=map.get(key)||{key,name,unit,qty:0,unknown:false,cat:ingredientCategory(name)};let q=Number(it.qty);if(it.qty!=null&&Number.isFinite(q)&&Number(r.portions)>0)a.qty+=q*Number(e.eat)/Number(r.portions);else a.unknown=true;map.set(key,a)}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ro'))}

function applyVisual(shouldRender=true){let v=state.visual||{};document.documentElement.dataset.palette=V15_THEMES.some(t=>t[0]===v.palette)?v.palette:'mint';document.documentElement.dataset.mode=v.mode==='dark'?'dark':'light';let m=document.querySelector('meta[name="theme-color"]');if(m)m.content=v.mode==='dark'?'#171b21':'#f5f8f5';if(shouldRender)render()}

function weightView(){let all=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),limit=weightRange==='all'?null:Number(weightRange),minDate=limit?plusDate(localIso(),-(limit-1)):null,data=all.filter(x=>!minDate||x.date>=minDate),first=all[0],last=all[all.length-1],diff=first&&last?last.kg-first.kg:null;return `<div class="eyebrow">Urmărește schimbările în timp</div><h1>Evoluția greutății ⚖️</h1><div class="analysisStats"><div class="metricCard"><small>Ultima măsurătoare</small><strong>${last?fmt(last.kg,1):'—'} <em>kg</em></strong></div><div class="metricCard"><small>Diferență față de prima</small><strong>${diff==null?'—':(diff>0?'+':'')+fmt(diff,1)} <em>kg</em></strong></div><div class="metricCard"><small>Măsurători</small><strong>${all.length}</strong></div></div><div class="panel"><h2>Adaugă o măsurătoare</h2><div class="grid"><label class="fieldLabel">Data<input id="weightDate" type="date" class="field compact" value="${chosenDate}"></label><label class="fieldLabel">Greutate (kg)<input id="weightVal" type="number" min="15" max="400" step="0.1" inputmode="decimal" class="field compact" placeholder="Ex. 82,5"></label></div><label class="fieldLabel">Notă (opțional)<input id="weightNote" class="field compact" maxlength="160" placeholder="Ex. Dimineața"></label><button class="btn primary block" onclick="setWeight()">＋ Salvează greutatea</button><p class="tiny">O singură măsurătoare pe zi. Poți înlocui valoarea introducând-o din nou pentru aceeași dată.</p></div><div class="panel"><div class="row"><h2 style="margin:0">Grafic greutate</h2><select class="smallSelect" aria-label="Interval greutate" onchange="weightRange=this.value;render()"><option value="all" ${weightRange==='all'?'selected':''}>Tot istoricul</option><option value="30" ${weightRange==='30'?'selected':''}>30 zile</option><option value="90" ${weightRange==='90'?'selected':''}>90 zile</option></select></div>${weightChart(data)}<p class="tiny">Evoluția se bazează pe măsurătorile introduse, nu pe e function getProgressDB(){if(progressPhotoDBPromise)return progressPhotoDBPromise;progressPhotoDBPromise=new Promise((resolve,reject)=>{let request=indexedDB.open(PROGRESS_DB,1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(PROGRESS_STORE))request.result.createObjectStore(PROGRESS_STORE)};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});return progressPhotoDBPromise}

async function compressProgressPhoto(file){if(file.size>30*1024*1024)throw Error('Fotografia depășește 30 MB.');const bitmap=await createImageBitmap(file),max=1500,ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);if(bitmap.close)bitmap.close();return new Promise((res,rej)=>canvas.toBlob(blob=>blob?res(blob):rej(Error('Nu am putut procesa fotografia.')),'image/jpeg',.84))}

function zipPack(entries){let parts=[],central=[],offset=0,encoder=new TextEncoder();for(let [name,bytes] of entries){let nm=encoder.encode(name),len=bytes.length,crc=zipCRC(bytes),h=new Uint8Array(30+nm.length),d=new DataView(h.buffer);d.setUint32(0,0x04034b50,true);d.setUint16(4,20,true);d.setUint16(6,0,true);d.setUint16(8,0,true);d.setUint32(14,crc,true);d.setUint32(18,len,true);d.setUint32(22,len,true);d.setUint16(26,nm.length,true);h.set(nm,30);parts.push(h,bytes);let c=new Uint8Array(46+nm.length),dc=new DataView(c.buffer);dc.setUint32(0,0x02014b50,true);dc.setUint16(4,20,true);dc.setUint16(6,20,true);dc.setUint32(16,crc,true);dc.setUint32(20,len,true);dc.setUint32(24,len,true);dc.setUint16(28,nm.length,true);dc.setUint32(42,offset,true);c.set(nm,46);central.push(c);offset+=h.length+len;}let totalC=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),de=new DataView(end.buffer);de.setUint32(0,0x06054b50,true);de.setUint16(8,entries.length,true);de.setUint16(10,entries.length,true);de.setUint32(12,totalC,true);de.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'});}
async function exportProgressArchive(){try{if(!state.progressPhotos.length)return alert('Nu ai fotografii de exportat.');let metadata={version:1,photos:state.progressPhotos},list=[['progress-meta.json',new TextEncoder().encode(JSON.stringify(metadata))]];for(let x of state.progressPhotos){let b=await readProgressBlob(x.id);if(b)list.push(['images/'+x.id+'.jpg',new Uint8Array(await b.arrayBuffer())])}let zip=zipPack(list),link=document.createElement('a'),url=URL.createObjectURL(zip);link.href=url;link.download='MealPlan-Poze-Progres-'+localIso()+'.zip';link.click();setTimeout(()=>URL.revokeObjectURL(url),12000)}catch(e){alert('Backup-ul fotografiilor a eșuat: '+e.message)}}
async function importProgressArchive(file){if(!file)return;try{if(file.size>250*1024*1024)throw Error('Arhiva depășește 250 MB.');let ab=await file.arrayBuffer(),entries=parseStoreZip(ab),entry=entries.get('progress-meta.json');if(!entry)throw Error('Arhivă fără metadate MealPlan.');let meta=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,entry.start,entry.end-entry.start)));if(meta.version!==1||!Array.isArray(meta.photos)||meta.photos.length>2000)throw Error('Metadatele nu sunt valide.');let count=0;for(let m of meta.photos){if(!validIso(m.date)||!/^p[a-zA-Z0-9]{5,40}$/.test(String(m.id)))continue;let ent=entries.get('images/'+m.id+'.jpg');if(!ent)continue;let newId='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10),blob=new Blob([ab.slice(ent.start,ent.end)],{type:'image/jpeg'});if(!blob.size||blob.size>12*1024*1024)continue;await saveProgressBlob(newId,blob);state.progressPhotos.push({id:newId,date:m.date,note:String(m.note||'').slice(0,120),created:Number(m.created)||Date.now()});count++}state.progressPhotos.sort((a,b)=>b.date.localeCompare(a.date));save();render();alert(count+' fotografii restaurate local.')}catch(e){alert('Importul fotografiilor a eșuat: '+e.message)}}
