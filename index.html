<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10241f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>MealPlan • Rețetele mele</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e9f2ec;background:#0d1916;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:860px;margin:auto;min-height:100dvh;padding:18px 17px 95px}header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px}.brand{font-weight:850;font-size:23px;letter-spacing:-.8px}.brand em{font-style:normal;color:#7cdda7}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#79bb98}h1{margin:5px 0 10px;font-size:27px;letter-spacing:-.7px}h2{font-size:18px;margin:0 0 14px}p{color:#abbfb5;line-height:1.5}.sub{font-size:13px;color:#a5b9ac}.panel,.card{background:#162720;border:1px solid #2a4437;border-radius:18px;padding:17px;margin:0 0 13px}.highlight{background:linear-gradient(125deg,#234f39,#1b3228)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#203b2e;padding:10px 6px;text-align:center;border-radius:11px}.stat b{display:block;font-size:17px}.stat small{color:#afd4bc;font-size:10px} .muted{color:#a5b9ac}.tiny{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.start{justify-content:flex-start}.grow{flex:1}.chip{padding:7px 10px;border-radius:99px;background:#284235;font-size:12px;color:#beedcb;white-space:nowrap}.chip.post{background:#1c533b;color:#a8ebc1}.btn{border:1px solid #466650;color:#e1f5e8;background:#244333;border-radius:12px;padding:11px 14px;font-weight:700}.btn.primary{background:#8beaac;color:#092318;border-color:#8beaac}.btn.ghost{background:transparent}.btn:disabled{opacity:.35}.field{width:100%;background:#0f2119;color:#ecf5ed;border:1px solid #365442;border-radius:11px;padding:11px 12px;margin:5px 0 12px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#11221c;border-top:1px solid #375342;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.tabs>div{width:min(860px,100%);display:flex}.tab{flex:1;padding:12px 3px;background:none;border:0;color:#8da998;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:4px}.tab strong{font-size:20px;font-weight:500}.tab.active{color:#9ee9b9}.recipe{width:100%;text-align:left;background:#172b22;border:1px solid #2c4838;color:#f4f8f4;border-radius:15px;padding:14px;margin:0 0 9px}.recipe b{display:block;margin-bottom:6px;font-size:15px}.pillbox{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.day{padding:10px 14px;border-radius:14px;border:1px solid #3d604c;background:#15261f;color:#d9eedf;min-width:76px}.day.selected{border-color:#92edb3;background:#28533a}.days{display:flex;overflow-x:auto;gap:8px;margin:10px 0 16px;padding-bottom:7px} .meal{border-top:1px solid #35503c;padding:12px 0} .progress{height:8px;border-radius:7px;overflow:hidden;background:#36503e;margin:10px 0}.progress span{display:block;height:100%;background:#8beaac}.notice{border-left:3px solid #f7c16a;padding:9px 12px;background:#3c3222;border-radius:5px;margin:12px 0;font-size:13px;color:#f2e0bc}.modalWrap{position:fixed;inset:0;background:#000a;z-index:15;display:flex;justify-content:center;align-items:end}.modal{background:#162920;border:1px solid #3d5e47;border-radius:24px 24px 0 0;max-width:860px;width:100%;padding:20px;max-height:92dvh;overflow-y:auto}.close{float:right}.ing{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #2c4436;font-size:13px}.steps{white-space:pre-line;line-height:1.6;color:#d7e9dc;font-size:14px}.mini{font-size:11px;color:#96b5a1}.empty{text-align:center;padding:28px 15px;color:#a5bdac}.checkbox{accent-color:#8beaac;width:19px;height:19px}.link{color:#a2f0b7}.hidden{display:none}@media(min-width:600px){.recipesGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.recipe{margin:0}.modal{border-radius:22px;margin-bottom:4vh}.stats .stat b{font-size:21px}}
</style></head><body><main id="app"></main><nav class="tabs"><div id="tabs"></div></nav><div id="modal"></div><script>
'use strict';
const KEY='mealplanner-user-v1', RKEY='mealplanner-recipes-v1', DAYS=['Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă','Duminică'], SLOTS=['Mic dejun','Prânz','Cină','Gustare'];
let state=load(KEY,{fast:[2,4],plan:{},checked:{},target:2200}),recipes=load(RKEY,[]),tab='home',chosenDay=0,filter='all',search='',minProtein=0,maxKcal=0,selectedRecipe=null,selectedPortions=1,addDay=0,addSlot='Prânz';
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function saveRecipes(){localStorage.setItem(RKEY,JSON.stringify(recipes))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n,d=0){return Number(n||0).toLocaleString('ro-RO',{maximumFractionDigits:d})}function macros(r){return r.macros||{}}function dayType(d){return state.fast.includes(d)?'post':'normal'}function getRec(id){return recipes.find(x=>x.id===id)}function weeklyDay(d){return state.plan[d]||[]}
function total(d){let z={kcal:0,protein:0,carbs:0,fat:0};for(let e of weeklyDay(d)){let r=getRec(e.id);if(!r)continue;for(let k of Object.keys(z))z[k]+=(Number(macros(r)[k])||0)*(Number(e.eat)||1)}return z}
function statUI(m,portionGrams){return `<div class="stats">${[['kcal','kcal'],['protein','P g'],['carbs','C g'],['fat','G g']].map(([k,label])=>`<div class="stat"><b>${m[k]===null||m[k]===undefined?'—':fmt(m[k],1)}</b><small>${label}</small></div>`).join('')}</div>`}
function render(){document.getElementById('tabs').innerHTML=[['home','⌂','Acasă'],['recipes','▤','Rețete'],['plan','▦','Plan'],['shopping','▧','Cumpărături'],['settings','⚙','Setări']].map(([k,i,l])=>`<button class="tab ${tab===k?'active':''}" onclick="go('${k}')"><strong>${i}</strong>${l}</button>`).join('');let content=tab==='home'?home():tab==='recipes'?library():tab==='plan'?planner():tab==='shopping'?shopping():settings();document.getElementById('app').innerHTML=`<header><div class="brand">meal<em>plan</em><div class="eyebrow">rețetele mele • personal</div></div><span class="chip">${recipes.length} rețete</span></header>`+content}
function home(){let sum=total(chosenDay);return `<div class="eyebrow">Planul tău alimentar</div><h1>Ce gătim azi?</h1><div class="panel highlight"><div class="row"><b>Obiectiv zilnic</b><span class="chip">${fmt(state.target)} kcal</span></div><h1>${fmt(sum.kcal)} <span class="sub">/ ${fmt(state.target)} kcal</span></h1><div class="progress"><span style="width:${Math.min(100,100*sum.kcal/Math.max(1,state.target))}%"></span></div>${statUI(sum)}<p class="tiny">Totalul include porțiile planificate pentru ${DAYS[chosenDay].toLowerCase()}.</p></div><div class="row"><h2>Ziua selectată</h2><button class="btn ghost" onclick="go('plan')">Planifică →</button></div>${daysUI()}<div class="panel"><div class="row"><b>${DAYS[chosenDay]}</b><span class="chip ${dayType(chosenDay)}">${dayType(chosenDay)==='post'?'🌿 De post':'Normal'}</span></div>${weeklyDay(chosenDay).length?weeklyDay(chosenDay).map(e=>{let r=getRec(e.id);return r?`<div class="meal"><b>${esc(e.slot)}</b><div class="sub">${esc(r.name)} · ${e.eat} porție/porții</div></div>`:''}).join(''):'<p>Nu ai planificat încă mese pentru această zi.</p>'}<button class="btn primary" onclick="startAdd(${chosenDay})">+ Adaugă masă</button></div><div class="panel"><b>Biblioteca personală</b><p>${recipes.length?'Caută rețete, filtrează după proteine și kcal sau adaptează porțiile.':'Importă biblioteca privată din Setări ca să apară rețetele din PDF-uri.'}</p><button class="btn" onclick="go('${recipes.length?'recipes':'settings'}')">${recipes.length?'Vezi rețetele':'Importă rețete'} →</button></div>`}
function daysUI(){return `<div class="days">${DAYS.map((d,i)=>`<button class="day ${i===chosenDay?'selected':''}" onclick="chooseDay(${i})"><b>${d.slice(0,3)}</b><div class="tiny">${dayType(i)==='post'?'🌿 Post':'Normal'}</div></button>`).join('')}</div>`}
function chooseDay(i){chosenDay=i;render()}function go(t){tab=t;search='';filter='all';render()}function library(){let filtered=recipes.filter(r=>(filter==='all'||r.type===filter)&&r.name.toLowerCase().includes(search.toLowerCase())&&Number(macros(r).protein||0)>=minProtein&&(!maxKcal||Number(macros(r).kcal||0)<=maxKcal));return `<div class="eyebrow">Colecția personală</div><h1>Biblioteca de rețete</h1><div class="panel"><input class="field" placeholder="Caută o rețetă..." value="${esc(search)}" oninput="search=this.value;refreshResults()" id="searchbox"><div class="row"><select class="field" style="margin:0" onchange="filter=this.value;refreshResults()"><option value="all" ${filter==='all'?'selected':''}>Toate</option><option value="post" ${filter==='post'?'selected':''}>De post</option><option value="normal" ${filter==='normal'?'selected':''}>Normale</option></select><select class="field" style="margin:0" onchange="minProtein=+this.value;refreshResults()">${[0,10,20,30,40].map(x=>`<option value="${x}" ${minProtein===x?'selected':''}>Proteine ≥ ${x}g</option>`).join('')}</select></div><select class="field" onchange="maxKcal=+this.value;refreshResults()">${[[0,'Orice număr de calorii'],[300,'Max 300 kcal'],[500,'Max 500 kcal'],[700,'Max 700 kcal']].map(([v,t])=>`<option value="${v}" ${maxKcal===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="recipeResults">${resultsHTML(filtered)}</div>`}
function resultsHTML(arr){return `<p class="tiny">${arr.length} rețete găsite</p><div class="recipesGrid">${arr.map(r=>`<button class="recipe" onclick="openRecipe('${esc(r.id)}')"><div class="row"><span class="chip ${r.type==='post'?'post':''}">${r.type==='post'?'🌿 De post':'Normal'}</span><span class="mini">${r.minutes?`${r.minutes} min`:''}</span></div><b style="margin-top:10px">${esc(r.name)}</b><div class="sub">${fmt(macros(r).kcal)} kcal · ${fmt(macros(r).protein,1)} g proteine / porție</div><div class="mini" style="margin-top:5px">${r.portions} porții inițiale · ${r.portionGrams?`~${r.portionGrams} g/porție`:'gramaj final necunoscut'}</div></button>`).join('')}</div>${!arr.length?'<div class="empty">Nu există rețete pentru filtrele selectate.</div>':''}`}
function refreshResults(){let arr=recipes.filter(r=>(filter==='all'||r.type===filter)&&r.name.toLowerCase().includes(search.toLowerCase())&&Number(macros(r).protein||0)>=minProtein&&(!maxKcal||Number(macros(r).kcal||0)<=maxKcal));document.getElementById('recipeResults').innerHTML=resultsHTML(arr)}
function openRecipe(id){let r=getRec(id);if(!r)return;selectedRecipe=id;selectedPortions=r.portions||1;showRecipe()}function showRecipe(){let r=getRec(selectedRecipe);if(!r)return;let f=selectedPortions/r.portions,m=macros(r),per100=r.portionGrams?Object.fromEntries(Object.entries(m).map(([k,v])=>[k,v==null?null:v*100/r.portionGrams])):null;document.getElementById('modal').innerHTML=`<div class="modalWrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><button class="btn ghost close" onclick="hideModal()">✕</button><span class="chip ${r.type==='post'?'post':''}">${r.type==='post'?'🌿 De post':'Normal'}</span><h1>${esc(r.name)}</h1><p class="tiny">Sursă: ${esc(r.source)}, pag. ${r.page} · ${r.minutes||'?'} minute</p><div class="panel"><div class="row"><b>Porții de gătit</b><div class="row"><button class="btn" onclick="adjustPortions(-1)">−</button><b>${selectedPortions}</b><button class="btn" onclick="adjustPortions(1)">+</button></div></div><p class="tiny">Rețeta originală: ${r.portions} porții. Macro per porție nu se schimbă când gătești mai multe porții.</p></div><h2>Per porție ${r.portionGrams?`(~${fmt(r.portionGrams)} g)`:'(gramaj necunoscut)'}</h2>${statUI(m)}<h2 style="margin-top:18px">Per 100 g</h2>${per100?statUI(per100):'<div class="notice">Greutatea porției gătite nu a fost identificată cu certitudine. Nu afișăm valori nutriționale inventate.</div>'}<h2 style="margin-top:20px">Ingrediente pentru ${selectedPortions} porții</h2>${r.ingredients.map(i=>`<div class="ing"><span>${esc(i.name)}</span><b>${i.qty!=null?`${fmt(i.qty*f,2)} ${esc(i.unit)}`:'după gust'}</b></div>`).join('')}<h2 style="margin-top:22px">Mod de preparare</h2><div class="steps">${esc(r.instructions||'Instrucțiunile nu au fost identificate.')}</div><div class="notice">Rețetele au fost extrase automat. Verifică ingredientele și gramajele în PDF-ul original înainte de preparare.</div><button class="btn primary" style="width:100%" onclick="startAddRecipe('${esc(r.id)}')">+ Adaugă în plan</button></div></div>`}
function adjustPortions(d){selectedPortions=Math.max(1,Math.min(50,selectedPortions+d));showRecipe()}function hideModal(){document.getElementById('modal').innerHTML=''}function closeModal(e){if(e.target.classList.contains('modalWrap'))hideModal()}
function planner(){let sum=total(chosenDay);return `<div class="eyebrow">Meniul săptămânii</div><h1>Planificator</h1>${daysUI()}<div class="panel"><div class="row"><h2 style="margin:0">${DAYS[chosenDay]}</h2><label class="row"><input type="checkbox" class="checkbox" ${dayType(chosenDay)==='post'?'checked':''} onchange="toggleFast(${chosenDay},this.checked)"> <b>Zi de post</b></label></div><div class="notice" style="${dayType(chosenDay)==='post'?'':'display:none'}">În zilele de post sunt permise numai rețetele „De post”. Mesele deja adăugate care nu corespund sunt evidențiate.</div>${SLOTS.map(s=>`<div class="meal"><div class="row"><b>${s}</b><button class="btn ghost" onclick="startAdd(${chosenDay},'${s}')">+ Adaugă</button></div>${weeklyDay(chosenDay).map((e,i)=>{if(e.slot!==s)return '';let r=getRec(e.id);return r?`<div class="row" style="margin-top:9px"><div class="grow"><b class="tiny">${esc(r.name)}</b><div class="mini">${e.eat} porție/porții · ${fmt(e.eat*macros(r).kcal)} kcal ${dayType(chosenDay)==='post'&&r.type!=='post'?'⚠️ incompatibil cu postul':''}</div></div><button class="btn ghost" onclick="removeMeal(${chosenDay},${i})">✕</button></div>`:''}).join('')}</div>`).join('')}<div class="row"><b>Total zi</b><b>${fmt(sum.kcal)} kcal · ${fmt(sum.protein,1)} g P</b></div></div>`}
function toggleFast(day,val){if(val){if(!state.fast.includes(day))state.fast.push(day)}else state.fast=state.fast.filter(i=>i!==day);save();render()}function removeMeal(d,i){state.plan[d].splice(i,1);save();render()}
function startAdd(d,slot='Prânz'){addDay=d;addSlot=slot;showAdd()}function startAddRecipe(id){hideModal();startAdd(chosenDay,'Prânz');document.getElementById('addRecipe').value=id;updateAddInfo()}
function showAdd(){let opts=recipes.filter(r=>dayType(addDay)!=='post'||r.type==='post');document.getElementById('modal').innerHTML=`<div class="modalWrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><button class="btn ghost close" onclick="hideModal()">✕</button><h2>Adaugă masă · ${DAYS[addDay]}</h2><p class="tiny">${dayType(addDay)==='post'?'🌿 Sunt afișate numai rețete de post.':'Poți alege orice rețetă.'}</p><label class="tiny">Momentul mesei</label><select class="field" id="addSlot">${SLOTS.map(s=>`<option ${s===addSlot?'selected':''}>${s}</option>`).join('')}</select><label class="tiny">Rețetă</label><select class="field" id="addRecipe" onchange="updateAddInfo()">${opts.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select>${!opts.length?'<div class="notice">Importă mai întâi biblioteca de rețete.</div>':''}<label class="tiny">Porții consumate</label><input id="eatPortions" class="field" type="number" min="0.25" step="0.25" value="1"><div class="sub" id="addInfo"></div><button class="btn primary" style="width:100%;margin-top:15px" ${!opts.length?'disabled':''} onclick="confirmAdd()">Adaugă în plan</button></div></div>`;updateAddInfo()}
function updateAddInfo(){let r=getRec(document.getElementById('addRecipe')?.value);document.getElementById('addInfo').textContent=r?`${fmt(macros(r).kcal)} kcal și ${fmt(macros(r).protein,1)} g proteine per porție`:''}
function confirmAdd(){let id=document.getElementById('addRecipe').value,eat=Number(document.getElementById('eatPortions').value);let r=getRec(id);if(!r||!Number.isFinite(eat)||eat<=0||eat>100)return alert('Alege o rețetă și un număr valid de porții.');if(dayType(addDay)==='post'&&r.type!=='post')return alert('Această zi este de post.');(state.plan[addDay]??=[]).push({id,eat,slot:document.getElementById('addSlot').value});save();hideModal();tab='plan';chosenDay=addDay;render()}
function shopping(){let groups=new Map();for(let d=0;d<7;d++)for(let e of weeklyDay(d)){let r=getRec(e.id);if(!r)continue;for(let i of r.ingredients){let k=(i.name+'|'+i.unit).toLowerCase().trim(),a=groups.get(k)||{name:i.name,unit:i.unit,qty:0,unknown:false};if(i.qty!=null)a.qty+=i.qty*e.eat/r.portions;else a.unknown=true;groups.set(k,a)}}let arr=[...groups.values()].sort((a,b)=>a.name.localeCompare(b.name,'ro'));return `<div class="eyebrow">Din meniul săptămânii</div><h1>Lista de cumpărături</h1><p class="sub">Cantitățile sunt calculate pentru porțiile consumate planificate. Ingredientele identice se cumulează atunci când au aceeași unitate.</p><div class="panel"><div class="row"><b>${arr.length} ingrediente</b><button class="btn ghost" onclick="clearChecks()">Resetează bifele</button></div>${arr.map((i,j)=>{let key=(i.name+'|'+i.unit).toLowerCase().trim();return `<label class="ing" style="align-items:center"><span class="row start"><input type="checkbox" class="checkbox" ${state.checked[key]?'checked':''} onchange="checkItem('${encodeURIComponent(key)}',this.checked)"><span style="${state.checked[key]?'text-decoration:line-through;opacity:.55':''}">${esc(i.name)}</span></span><b>${i.qty?fmt(i.qty,2)+' '+esc(i.unit):'după gust'}</b></label>`}).join('')}${!arr.length?'<div class="empty">Adaugă mese în planificator pentru a genera lista.</div>':''}</div><button class="btn" onclick="copyShopping()">Copiază lista</button>`}
function checkItem(key,v){state.checked[decodeURIComponent(key)]=v;save();render()}function clearChecks(){state.checked={};save();render()}function copyShopping(){let a=[];for(let d=0;d<7;d++)for(let e of weeklyDay(d)){let r=getRec(e.id);if(r)r.ingredients.forEach(i=>a.push(`${i.name}: ${i.qty!=null?fmt(i.qty*e.eat/r.portions,2)+' '+i.unit:'după gust'}`))}navigator.clipboard?.writeText(a.join('\n')).then(()=>alert('Lista a fost copiată.')).catch(()=>alert('Copiere indisponibilă.'))}
function settings(){return `<div class="eyebrow">Preferințe și date</div><h1>Setări</h1><div class="panel"><h2>Importă rețetele personale</h2><p>Fișierul JSON se citește local în browser și NU este trimis către GitHub sau alt server. Păstrează-l privat.</p><input type="file" accept=".json,application/json" class="field" id="importFile" onchange="importRecipes(this.files[0])"><p class="tiny">${recipes.length} rețete importate. Importarea înlocuiește biblioteca actuală, dar păstrează meniul săptămânal.</p></div><div class="panel"><h2>Țintă calorică</h2><input class="field" type="number" min="500" max="10000" id="target" value="${state.target}"><button class="btn" onclick="setTarget()">Salvează obiectivul</button></div><div class="panel"><h2>Backup personal</h2><p>Exportă și păstrează local planificarea și rețetele private. Datele nu sunt sincronizate între dispozitive.</p><button class="btn" onclick="backup()">Exportă backup JSON</button></div><div class="notice">Codul public al aplicației nu include rețetele din cărți. Nu încărca fișierul privat JSON pe GitHub.</div>`}
function setTarget(){let n=+document.getElementById('target').value;if(!Number.isFinite(n)||n<500||n>10000)return alert('Valoare invalidă.');state.target=n;save();render()}
function validateRecipe(r){return r&&typeof r.id==='string'&&typeof r.name==='string'&&['post','normal'].includes(r.type)&&Number(r.portions)>0&&Array.isArray(r.ingredients)&&typeof r.macros==='object'}
async function importRecipes(file){if(!file)return;try{let txt=await file.text();if(txt.length>7000000)throw Error('Fișier prea mare');let x=JSON.parse(txt);if(!Array.isArray(x)||!x.length||!x.every(validateRecipe))throw Error('Formatul fișierului nu este valid');let ids=new Set(x.map(r=>r.id));if(ids.size!==x.length)throw Error('Există identificatori duplicați');recipes=x;saveRecipes();alert('Au fost importate '+x.length+' rețete.');render()}catch(e){alert('Import nereușit: '+e.message)}}
function downloadJson(name,obj){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){downloadJson('mealplan-backup.json',{state,recipes})}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));render();
</script></body></html>
