async function getPhotoBlob(path){const db=await getPhotoDb();return new Promise((res,rej)=>{const req=db.transaction(PHOTO_STORE,'readonly').objectStore(PHOTO_STORE).get(path);req.onsuccess=()=>res(req.result||null);req.onerror=()=>rej(req.error)})}
async function photoUrl(path){if(photoUrls.has(path))return photoUrls.get(path);const blob=await getPhotoBlob(path);if(!blob)return null;const url=URL.createObjectURL(blob);photoUrls.set(path,url);return url}
async function fillOneImage(img){const path=img.getAttribute('data-pic');if(!path||img.dataset.loaded)return;img.dataset.loaded='yes';try{let u=await photoUrl(path);if(u&&img.isConnected)img.src=u}catch(e){console.warn('Imagine indisponibila',e)}}
function hydratePhotos(){const imgs=[...document.querySelectorAll('img[data-pic]:not([data-loaded])')];if(!imgs.length)return;if('IntersectionObserver' in window){if(photoObserver)photoObserver.disconnect();photoObserver=new IntersectionObserver(entries=>{for(const en of entries)if(en.isIntersecting){photoObserver.unobserve(en.target);fillOneImage(en.target)}},{rootMargin:'250px'});imgs.forEach(im=>photoObserver.observe(im))}else imgs.forEach(fillOneImage)}
function parseStoreZip(ab){const v=new DataView(ab),data=new Uint8Array(ab),names=new TextDecoder(),entries=new Map();let pos=0;while(pos+30<ab.byteLength&&v.getUint32(pos,true)===0x04034b50){const flags=v.getUint16(pos+6,true),method=v.getUint16(pos+8,true),len=v.getUint32(pos+18,true),nl=v.getUint16(pos+26,true),el=v.getUint16(pos+28,true);if(flags&8||method!==0)throw Error('Arhiva nu are formatul de import așteptat (ZIP fără compresie).');let name=names.decode(data.subarray(pos+30,pos+30+nl));let start=pos+30+nl+el,end=start+len;if(end>ab.byteLength)throw Error('Arhivă incompletă');entries.set(name,{start,end});pos=end}return entries}
async function importPrivatePack(file){if(!file)return;try{
 if(!confirm('Importăm biblioteca completă și fotografiile local pe acest dispozitiv? Planurile existente vor fi păstrate.'))return;
 let buf=await file.arrayBuffer(),entries=parseStoreZip(buf);let rec=entries.get('retete-complete.json');if(!rec)throw Error('Fișierul retete-complete.json lipsește din arhivă.');let x=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,rec.start,rec.end-rec.start)));
 if(!Array.isArray(x)||x.length!==362||!x.every(validateRecipe))throw Error('Biblioteca JSON nu este validă.');let ids=new Set(x.map(r=>r.id));if(ids.size!==362)throw Error('ID-uri duplicate.');
 let imgEntries=[...entries].filter(([name])=>name.startsWith('photos/')||name.startsWith('pages/'));
 if(imgEntries.length!==724)throw Error('Lipsesc fotografii/pagini de verificare: '+imgEntries.length+'/724.');
 let db=await getPhotoDb();await new Promise((res,rej)=>{let tx=db.transaction(PHOTO_STORE,'readwrite'),store=tx.objectStore(PHOTO_STORE);for(const [name,{start,end}] of imgEntries)store.put(new Blob([buf.slice(start,end)],{type:'image/jpeg'}),name);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});
 recipes=x;saveRecipes();for(let u of photoUrls.values())URL.revokeObjectURL(u);photoUrls.clear();alert('Au fost importate '+recipes.length+' rețete și '+imgEntries.length+' fotografii/pagini de referință. Datele sunt locale.');render();
 }catch(e){alert('Importul pachetului nu a reușit: '+e.message)}}
async function showSourcePage(id){let r=getRec(id);if(!r)return;let u=await photoUrl(r.sourcePageImage);if(!u)return alert('Importă pachetul privat complet pentru a vedea pagina originală.');document.getElementById('modal').innerHTML=`<div class="modalWrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><button class="btn ghost" onclick="showRecipe()">← Înapoi la rețetă</button><h2>Pagina originală · ${esc(r.source)} · ${r.page}</h2><img class="recipeImagePage" src="${u}" alt="Pagina originală a rețetei"></div></div>`}

function render(){document.getElementById('tabs').innerHTML=[['home','⌂','Acasă'],['recipes','▤','Rețete'],['plan','▦','Plan'],['shopping','▧','Cumpărături'],['settings','⚙','Setări']].map(([k,i,l])=>`<button class="tab ${tab===k?'active':''}" onclick="go('${k}')"><strong>${i}</strong>${l}</button>`).join('');let content=tab==='home'?home():tab==='recipes'?library():tab==='plan'?planner():tab==='shopping'?shopping():settings();document.getElementById('app').innerHTML=`<header><div class="brand">meal<em>plan</em><div class="eyebrow">rețetele mele • v1.2</div></div><span class="chip">${recipes.length} rețete</span></header>`+content;queueMicrotask(hydratePhotos)}
function home(){let sum=total(chosenDay);return `<div class="eyebrow">Planul tău alimentar</div><h1>Ce gătim azi?</h1><div class="panel highlight"><div class="row"><b>Obiectiv zilnic</b><span class="chip">${fmt(state.target)} kcal</span></div><h1>${fmt(sum.kcal)} <span class="sub">/ ${fmt(state.target)} kcal</span></h1><div class="progress"><span style="width:${Math.min(100,100*sum.kcal/Math.max(1,state.target))}%"></span></div>${statUI(sum)}<p class="tiny">Totalul include porțiile planificate pentru ${DAYS[chosenDay].toLowerCase()}.</p></div><div class="row"><h2>Ziua selectată</h2><button class="btn ghost" onclick="go('plan')">Planifică →</button></div>${daysUI()}<div class="panel"><div class="row"><b>${DAYS[chosenDay]}</b><span class="chip ${dayType(chosenDay)}">${dayType(chosenDay)==='post'?'🌿 De post':'Normal'}</span></div>${weeklyDay(chosenDay).length?weeklyDay(chosenDay).map(e=>{let r=getRec(e.id);return r?`<div class="meal"><b>${esc(e.slot)}</b><div class="sub">${esc(r.name)} · ${e.eat} porție/porții</div></div>`:''}).join(''):'<p>Nu ai planificat încă mese pentru această zi.</p>'}<button class="btn primary" onclick="startAdd(${chosenDay})">+ Adaugă masă</button></div><div class="panel"><b>Biblioteca personală</b><p>${recipes.length?'Caută rețete, filtrează după proteine și kcal sau adaptează porțiile.':'Importă biblioteca privată din Setări ca să apară rețetele din PDF-uri.'}</p><button class="btn" onclick="go('${recipes.length?'recipes':'settings'}')">${recipes.length?'Vezi rețetele':'Importă rețete'} →</button></div>`}
function daysUI(){return `<div class="days">${DAYS.map((d,i)=>`<button class="day ${i===chosenDay?'selected':''}" onclick="chooseDay(${i})"><b>${d.slice(0,3)}</b><div class="tiny">${dayType(i)==='post'?'🌿 Post':'Normal'}</div></button>`).join('')}</div>`}
function chooseDay(i){chosenDay=i;render()}function go(t){tab=t;search='';filter='all';render()}function library(){let filtered=recipes.filter(r=>(filter==='all'||r.type===filter)&&r.name.toLowerCase().includes(search.toLowerCase())&&Number(macros(r).protein||0)>=minProtein&&(!maxKcal||Number(macros(r).kcal||0)<=maxKcal));return `<div class="eyebrow">Colecția personală</div><h1>Biblioteca de rețete</h1><div class="panel"><input class="field" placeholder="Caută o rețetă..." value="${esc(search)}" oninput="search=this.value;refreshResults()" id="searchbox"><div class="row"><select class="field" style="margin:0" onchange="filter=this.value;refreshResults()"><option value="all" ${filter==='all'?'selected':''}>Toate</option><option value="post" ${filter==='post'?'selected':''}>De post</option><option value="normal" ${filter==='normal'?'selected':''}>Normale</option></select><select class="field" style="margin:0" onchange="minProtein=+this.value;refreshResults()">${[0,10,20,30,40].map(x=>`<option value="${x}" ${minProtein===x?'selected':''}>Proteine ≥ ${x}g</option>`).join('')}</select></div><select class="field" onchange="maxKcal=+this.value;refreshResults()">${[[0,'Orice număr de calorii'],[300,'Max 300 kcal'],[500,'Max 500 kcal'],[700,'Max 700 kcal']].map(([v,t])=>`<option value="${v}" ${maxKcal===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="recipeResults">${resultsHTML(filtered)}</div>`}
function resultsHTML(arr){return `<p class="tiny">${arr.length} rețete găsite</p><div class="recipesGrid">${arr.map(r=>`<button class="recipe" onclick="openRecipe('${esc(r.id)}')"><div class="row"><span class="chip ${r.type==='post'?'post':''}">${r.type==='post'?'🌿 De post':'Normal'}</span><span class="mini">${r.minutes?`${r.minutes} min`:''}</span></div>${r.photo?`<img class="recipePhoto" data-pic="${esc(r.photo)}" alt="Fotografia rețetei ${esc(r.name)}" loading="lazy">`:''}<b style="margin-top:10px">${esc(r.name)}</b><div class="sub">${macros(r).kcal==null?'—':fmt(macros(r).kcal)} kcal · ${macros(r).protein==null?'—':fmt(macros(r).protein,1)} g proteine / porție</div><div class="mini" style="margin-top:5px">${r.portions?portionText(r.portions):'Porții neprecizate'} în rețeta originală</div>${r.warnings?.length?'<div class="badQA">⚠ Date de verificat cu pagina originală</div>':''}</button>`).join('')}</div>${!arr.length?'<div class="empty">Nu există rețete pentru filtrele selectate.</div>':''}`}
function refreshResults(){let arr=recipes.filter(r=>(filter==='all'||r.type===filter)&&r.name.toLowerCase().includes(search.toLowerCase())&&Number(macros(r).protein||0)>=minProtein&&(!maxKcal||Number(macros(r).kcal||0)<=maxKcal));document.getElementById('recipeResults').innerHTML=resultsHTML(arr);queueMicrotask(hydratePhotos)}
function portionsBase(r){const n=Number(r.portions);return Number.isFinite(n)&&n>0?n:null}
function portionText(n){return `${n} ${Number(n)===1?'porție':'porții'}`}
function formatAmount(q){if(!Number.isFinite(q))return '—';return new Intl.NumberFormat('ro-RO',{maximumFractionDigits:2}).format(Math.round(q*100)/100)}
// An ingredient is displayed word-for-word for the original yield. For different yields,
// adjust the quantity only when an unambiguous numerical quantity was extracted.
// The original source text remains in the private JSON and the source-page image.
function ingredientDisplay(i,r,desired){
 const raw=String(i.raw||i.name||'').trim();const base=portionsBase(r);
 if(i.groupHeader||!base||desired===base)return {value:raw,uncertain:false};
 const qty=Number(i.qty);
 if(i.qty!=null&&Number.isFinite(qty)){
   const scaled=qty*desired/base;
   let modified='';
   const leading=/^(\s*(?:\[opțional\]\s*)?)(\d+\/\d+|\d+(?:[.,]\d+)?|½|¼|¾)(?=\s|[a-zA-ZăâîșțĂÂÎȘȚ])/u;
   if(i.unit==='buc')modified=`${formatAmount(scaled)} × ${i.name}`;
   else if(/^(lingură|linguriță|felie|cană|ou)$/i.test(i.unit||'')){const plural={'lingură':'linguri','linguriță':'lingurițe','felie':'felii','cană':'căni','ou':'ouă'};const unit=scaled===1?i.unit:(plural[i.unit.toLowerCase()]||i.unit);modified=`${formatAmount(scaled)} ${unit} ${i.name}`;}
   else if(leading.test(raw))modified=raw.replace(leading,(_all,prefix)=>prefix+formatAmount(scaled));
   else {
     const suffix=/(\d+(?:[.,]\d+)?)\s*(g|gr|kg|ml|l)(?=\b)/i;
     if(suffix.test(raw))modified=raw.replace(suffix,(_all,num,unit)=>formatAmount(scaled)+' '+unit);
   }
   if(!modified)modified=(i.unit==='buc'?`${formatAmount(scaled)} × ${i.name}`:`${formatAmount(scaled)} ${i.unit||''} ${i.name}`).trim();
   // Secondary equivalents such as "2 gălbenușuri (~36 g)" are scaled too;
   // percentages (2% fat), temperatures and times are never changed.
   modified=modified.replace(/\((\s*[~≈]?\s*)(\d+(?:[.,]\d+)?)(\s*(?:g|ml)\b)/gi,(_whole,approx,num,unit)=>'('+approx+formatAmount(Number(num.replace(',','.'))*desired/base)+unit);
   return {value:modified,uncertain:false};
 }
 return {value:raw,uncertain:/\d|½|¼|¾/u.test(raw)};
}
function ingredientRows(r){return r.ingredients.map(i=>{const display=ingredientDisplay(i,r,selectedPortions);return i.groupHeader?`<div class="ingredientGroup">${esc(display.value)}</div>`:`<div class="ingredientLine"><span>${esc(display.value)}</span>${display.uncertain?'<span class="mini badQA">Cantitate de verificat</span>':''}</div>`}).join('')}
function openRecipe(id){let r=getRec(id);if(!r)return;selectedRecipe=id;selectedPortions=portionsBase(r)||1;showRecipe()}
function showRecipe(){
 let r=getRec(selectedRecipe);if(!r)return;
 let base=portionsBase(r),m=macros(r),unscaled=!base;
 const notes=(r.warnings||[]).filter(w=>!w.includes('Gramajul final')&&!w.includes('Gramajul porției'));
 const top=`<div class="modalWrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><button class="btn ghost close" onclick="hideModal()">✕</button><span class="chip ${r.type==='post'?'post':''}">${r.type==='post'?'🌿 De post':'Normal'}</span><h1>${esc(r.name)}</h1>${r.photo?`<img class="recipeHero" data-pic="${esc(r.photo)}" alt="Fotografie din PDF">`:''}<p class="tiny">Sursă: ${esc(r.source)}, pag. ${r.page} ${r.minutes?`· ${r.minutes} minute`:''}</p><button class="btn" onclick="showSourcePage('${esc(r.id)}')">🖼️ Verifică pagina originală</button> <button class="btn ghost" onclick="toggleFavorite('${esc(r.id)}');showRecipe()">♡ Favorite</button>`;
 const count=`<div class="panel portionsPanel"><div class="row"><div><b>Numărul de porții</b><p class="mini" style="margin:5px 0">Ingredientele din PDF sunt pentru <b>${base?portionText(base):'un număr neprecizat de porții'}</b>.</p></div><div class="row"><button aria-label="Scade porțiile" class="btn" ${unscaled?'disabled':''} onclick="adjustPortions(-1)">−</button><strong class="count">${selectedPortions}</strong><button aria-label="Crește porțiile" class="btn" ${unscaled?'disabled':''} onclick="adjustPortions(1)">+</button></div></div>${unscaled?'<div class="notice">PDF-ul nu precizează clar numărul de porții; verifică pagina originală înainte să modifici cantitățile.</div>':'<p class="tiny">Schimbarea numărului de porții ajustează cantitățile ingredientelor. Valorile nutriționale de mai jos rămân mereu <b>per porție</b>.</p>'}</div>`;
 const nutrient=`<h2>Valori nutriționale · per porție</h2>${statUI(m)}${m.fiber!=null||m.saturatedFat!=null?`<p class="tiny">${m.fiber!=null?'Fibre: '+fmt(m.fiber,1)+' g':''}${m.fiber!=null&&m.saturatedFat!=null?' · ':''}${m.saturatedFat!=null?'Grăsimi saturate: '+fmt(m.saturatedFat,1)+' g':''}</p>`:''}`;
 const ing=`<h2 style="margin-top:21px">Ingrediente pentru ${base?portionText(selectedPortions):'porțiile originale'}</h2><p class="mini">${base?`Original: ${portionText(base)}.`:'Numărul inițial de porții trebuie verificat.'} ${base&&base!==selectedPortions?'Cantitățile recunoscute au fost recalculate.':'Cantitățile sunt redate din PDF.'}</p><div class="ingredientsBox">${ingredientRows(r)}</div>`;
 const method=`<h2 style="margin-top:23px">Mod de preparare</h2><div class="steps">${esc(r.instructions||'Instrucțiunile nu au fost recunoscute; consultă pagina originală.')}</div>${r.practicalTips?`<h2 style="margin-top:20px">Sfaturi practice</h2><p>${esc(r.practicalTips)}</p>`:''}${r.allergens?`<h2>Alergeni</h2><p>${esc(r.allergens)}</p>`:''}${r.alternatives?`<h2>Variante și alternative</h2><p>${esc(r.alternatives)}</p>`:''}${r.description?`<h2>Descriere</h2><p>${esc(r.description)}</p>`:''}`;
 const finish=`${notes.length?`<div class="notice"><b>Verifică în PDF:</b> ${notes.map(esc).join('; ')}</div>`:''}<p class="mini">Transcrierea este extrasă automat. Folosește imaginea paginii originale pentru a confirma detaliile neclare.</p><button class="btn primary" style="width:100%" onclick="startAddRecipe('${esc(r.id)}')">+ Adaugă în plan</button></div></div>`;
 document.getElementById('modal').innerHTML=top+count+nutrient+ing+method+finish;
 queueMicrotask(hydratePhotos)
}
function adjustPortions(d){let r=getRec(selectedRecipe);if(!r||!portionsBase(r))return;selectedPortions=Math.max(1,Math.min(50,selectedPortions+d));showRecipe()}function hideModal(){document.getElementById('modal').innerHTML=''}function closeModal(e){if(e.target.classList.contains('modalWrap'))hideModal()}
function planner(){let sum=total(chosenDay);return `<div class="eyebrow">Meniul săptămânii</div><h1>Planificator</h1>${daysUI()}<div class="panel"><div class="row"><h2 style="margin:0">${DAYS[chosenDay]}</h2><label class="row"><input type="checkbox" class="checkbox" ${dayType(chosenDay)==='post'?'checked':''} onchange="toggleFast(${chosenDay},this.checked)"> <b>Zi de post</b></label></div><div class="notice" style="${dayType(chosenDay)==='post'?'':'display:none'}">În zilele de post sunt permise numai rețetele „De post”. Mesele deja adăugate care nu corespund sunt evidențiate.</div>${SLOTS.map(s=>`<div class="meal"><div class="row"><b>${s}</b><button class="btn ghost" onclick="startAdd(${chosenDay},'${s}')">+ Adaugă</button></div>${weeklyDay(chosenDay).map((e,i)=>{if(e.slot!==s)return '';let r=getRec(e.id);return r?`<div class="row" style="margin-top:9px"><div class="grow"><b class="tiny">${esc(r.name)}</b><div class="mini">${e.eat} porție/porții · ${fmt(e.eat*macros(r).kcal)} kcal ${dayType(chosenDay)==='post'&&r.type!=='post'?'⚠️ incompatibil cu postul':''}</div></div><button class="btn ghost" onclick="removeMeal(${chosenDay},${i})">✕</button></div>`:''}).join('')}</div>`).join('')}<div class="row"><b>Total zi</b><b>${fmt(sum.kcal)} kcal · ${fmt(sum.protein,1)} g P</b></div></div>`}
function toggleFast(day,val){if(val){if(!state.fast.includes(day))state.fast.push(day)}else state.fast=state.fast.filter(i=>i!==day);save();render()}function removeMeal(d,i){state.plan[d].splice(i,1);save();render()}
function startAdd(d,slot='Prânz'){addDay=d;addSlot=slot;showAdd()}function startAddRecipe(id){hideModal();startAdd(chosenDay,'Prânz');document.getElementById('addRecipe').value=id;updateAddInfo()}
function showAdd(){let opts=recipes.filter(r=>dayType(addDay)!=='post'||r.type==='post');document.getElementById('modal').innerHTML=`<div class="modalWrap" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><button class="btn ghost close" onclick="hideModal()">✕</button><h2>Adaugă masă · ${DAYS[addDay]}</h2><p class="tiny">${dayType(addDay)==='post'?'🌿 Sunt afișate numai rețete de post.':'Poți alege orice rețetă.'}</p><label class="tiny">Momentul mesei</label><select class="field" id="addSlot">${SLOTS.map(s=>`<option ${s===addSlot?'selected':''}>${s}</option>`).join('')}</select><label class="tiny">Rețetă</label><select class="field" id="addRecipe" onchange="updateAddInfo()">${opts.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select>${!opts.length?'<div class="notice">Importă mai întâi biblioteca de rețete.</div>':''}<label class="tiny">Porții consumate</label><input id="eatPortions" class="field" type="number" min="0.25" step="0.25" value="1"><div class="sub" id="addInfo"></div><button class="btn primary" style="width:100%;margin-top:15px" ${!opts.length?'disabled':''} onclick="confirmAdd()">Adaugă în plan</button></div></div>`;updateAddInfo()}
function updateAddInfo(){let r=getRec(document.getElementById('addRecipe')?.value);document.getElementById('addInfo').textContent=r?`${fmt(macros(r).kcal)} kcal și ${fmt(macros(r).protein,1)} g proteine per porție`:''}
function confirmAdd(){let id=document.getElementById('addRecipe').value,eat=Number(document.getElementById('eatPortions').value);let r=getRec(id);if(!r||!Number.isFinite(eat)||eat<=0||eat>100)return alert('Alege o rețetă și un număr valid de porții.');if(dayType(addDay)==='post'&&r.type!=='post')return alert('Această zi este de post.');(state.plan[addDay]??=[]).push({id,eat,slot:document.getElementById('addSlot').value});save();hideModal();tab='plan';chosenDay=addDay;render()}
function shopping(){let groups=new Map();for(let d=0;d<7;d++)for(let e of weeklyDay(d)){let r=getRec(e.id);if(!r)continue;for(let i of r.ingredients){if(i.groupHeader)continue;let k=(i.name+'|'+i.unit).toLowerCase().trim(),a=groups.get(k)||{name:i.name,unit:i.unit,qty:0,unknown:false};if(i.qty!=null&&r.portions)a.qty+=i.qty*e.eat/(r.portions||1);else a.unknown=true;groups.set(k,a)}}let arr=[...groups.values()].sort((a,b)=>a.name.localeCompare(b.name,'ro'));return `<div class="eyebrow">Din meniul săptămânii</div><h1>Lista de cumpărături</h1><p class="sub">Cantitățile sunt calculate pentru porțiile consumate planificate. Ingredientele identice se cumulează atunci când au aceeași unitate.</p><div class="panel"><div class="row"><b>${arr.length} ingrediente</b><button class="btn ghost" onclick="clearChecks()">Resetează bifele</button></div>${arr.map((i,j)=>{let key=(i.name+'|'+i.unit).toLowerCase().trim();return `<label class="ing" style="align-items:center"><span class="row start"><input type="checkbox" class="checkbox" ${state.checked[key]?'checked':''} onchange="checkItem('${encodeURIComponent(key)}',this.checked)"><span style="${state.checked[key]?'text-decoration:line-through;opacity:.55':''}">${esc(i.name)}</span></span><b>${i.unknown?'verifică rețeta':i.qty?fmt(i.qty,2)+' '+esc(i.unit):'după gust'}</b></label>`}).join('')}${!arr.length?'<div class="empty">Adaugă mese în planificator pentru a genera lista.</div>':''}</div><button class="btn" onclick="copyShopping()">Copiază lista</button>`}
function checkItem(key,v){state.checked[decodeURIComponent(key)]=v;save();render()}function clearChecks(){state.checked={};save();render()}function copyShopping(){let a=[];for(let d=0;d<7;d++)for(let e of weeklyDay(d)){let r=getRec(e.id);if(r)r.ingredients.filter(i=>!i.groupHeader).forEach(i=>a.push(`${i.name}: ${i.qty!=null?fmt(i.qty*e.eat/(r.portions||1),2)+' '+i.unit:'după gust'}`))}navigator.clipboard?.writeText(a.join('\n')).then(()=>alert('Lista a fost copiată.')).catch(()=>alert('Copiere indisponibilă.'))}
function settings(){return `<div class="eyebrow">Preferințe și date</div><h1>Setări</h1><div class="panel"><h2>Importă biblioteca privată (362 rețete + fotografii)</h2><p>Folosește ZIP-ul privat „MealPlan-PRIVATE-v1.2-362-RETETE-FOTO.zip”. Fotografii, pagini originale și rețete rămân în telefon/PC, nu pe GitHub.</p><input type="file" accept=".zip,application/zip" class="field" id="packFile" onchange="importPrivatePack(this.files[0])"><hr style="border:0;border-top:1px solid #385342;margin:20px 0"><h2>Alternativ: import numai JSON</h2><p>Fișierul JSON se citește local în browser și NU este trimis către GitHub sau alt server. Păstrează-l privat.</p><input type="file" accept=".json,application/json" class="field" id="importFile" onchange="importRecipes(this.files[0])"><p class="tiny">${recipes.length} rețete importate. Importarea înlocuiește biblioteca actuală, dar păstrează meniul săptămânal.</p></div><div class="panel"><h2>Țintă calorică</h2><input class="field" type="number" min="500" max="10000" id="target" value="${state.target}"><button class="btn" onclick="setTarget()">Salvează obiectivul</button></div><div class="panel"><h2>Backup personal</h2><p>Exportă planificarea și datele JSON. Fotografiile NU sunt incluse în backup-ul JSON: păstrează și arhiva ZIP privată originală pentru restaurare.</p><button class="btn" onclick="backup()">Exportă backup JSON</button></div><div class="notice">Codul public nu include texte sau fotografii din cărți. NU încărca arhiva privată sau JSON-ul pe GitHub.</div>`}
function setTarget(){let n=+document.getElementById('target').value;if(!Number.isFinite(n)||n<500||n>10000)return alert('Valoare invalidă.');state.target=n;save();render()}
function validateRecipe(r){return r&&typeof r.id==='string'&&typeof r.name==='string'&&['post','normal'].includes(r.type)&&(r.portions===null||Number(r.portions)>0)&&Array.isArray(r.ingredients)&&typeof r.macros==='object'}
async function importRecipes(file){if(!file)return;try{let txt=await file.text();if(txt.length>15000000)throw Error('Fișier prea mare');let x=JSON.parse(txt);if(!Array.isArray(x)||!x.length||!x.every(validateRecipe))throw Error('Formatul fișierului nu este valid');let ids=new Set(x.map(r=>r.id));if(ids.size!==x.length)throw Error('Există identificatori duplicați');recipes=x;saveRecipes();alert('Au fost importate '+x.length+' rețete.');render()}catch(e){alert('Import nereușit: '+e.message)}}
function downloadJson(name,obj){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){downloadJson('mealplan-backup.json',{state,recipes})}

function norm(x){return String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('ro').trim()}
// Clasificare orientativă după denumire, nu o afirmație despre clasificarea din carte.
function recipeKind(r){let n=norm(r.name);
 if(/ciorba|supa|bors|supa crema|supa-crema|supă|supă-cremă/.test(n))return 'soup';
 if(/cheesecake|budinca|prajitur|tort|biscuit|chec|brownie|briose|muffin|clatit|gogos|cremsnit|amandin|papanas|cozonac|ciocolat|inghetat|mousse|desert|prajit|terci|granola/.test(n))return 'dessert';
 if(/salata|wrap|sandvis|sandwich|lipie|hummus|humus|guacamole|aperitiv|bruschetta|tartin|pasta de|salată/.test(n))return 'salad';
 if(/omleta|oua|toast|mic dejun|ovaz|overnight|ou posat|fulgi de|scrambled|chia|ou ochi/.test(n))return 'breakfast';
 return 'main';}
function matchesRecipe(r,q,kind='all',time='all'){
 if(kind!=='all'&&recipeKind(r)!==kind)return false;
 if(time!=='all'&&(!Number(r.minutes)||Number(r.minutes)>Number(time)))return false;
 if(!q)return true;
 const h=norm([r.name,...(r.ingredients||[]).filter(i=>!i.groupHeader).map(i=>i.name||i.raw)].join(' '));
 return norm(q).split(/\s+/).every(w=>h.includes(w));
}
function favorite(id){return state.favorites.includes(id)}

function render(){document.getElementById('tabs').innerHTML=[['home','⌂','Acasă'],['recipes','▤','Rețete'],['plan','▦','Plan'],['shopping','▧','Listă'],['settings','⚙','Setări']].map(([k,i,l])=>`<button class="tab ${tab===k?'active':''}" aria-label="${l}" onclick="go('${k}')"><strong>${i}</strong>${l}</button>`).join('');let content=tab==='home'?home():tab==='recipes'?library():tab==='plan'?planner():tab==='shopping'?shopping():settings();document.getElementById('app').innerHTML=`<header><div class="brand">🥗 meal<span>plan</span><div class="eyebrow">rețetele mele • v1.3</div></div><span class="topCounter">${recipes.length} rețete</span></header>`+content;queueMicrotask(hydratePhotos)}

 return `<div class="eyebrow">Organizare simplă, mese mai bune</div><h1>Ce gătim azi? <span class="friendlyEmoji">🥑</span></h1><section class="welcome"><div class="row"><span class="welcomeCaption">Planul alimentar · ${DAYS[chosenDay]}</span><span class="welcomeBubble">${dayType(chosenDay)==='post'?'🌿 De post':'🍽️ Zi normală'}</span></div><div class="welcomeCalories">${fmt(sum.kcal)} <span>/ ${fmt(state.target)} kcal</span></div><div class="progress"><span style="width:${p}%"></span></div>${statUI(sum)}<p class="tiny">Totalul include numai porțiile din meniul zilei selectate.</p></section><div class="sectionHeader"><h2>Alege ziua</h2><button class="textAction" onclick="go('plan')">Vezi planul →</button></div>${daysUI()}<div class="panel"><div class="row"><h2 style="margin:0">Mesele de ${DAYS[chosenDay].toLowerCase()}</h2><span class="chip ${dayType(chosenDay)==='post'?'post':'normal'}">${dayType(chosenDay)==='post'?'🌿 Post':'Normal'}</span></div>${weeklyDay(chosenDay).length?weeklyDay(chosenDay).map(e=>{let r=getRec(e.id);return r?`<div class="homeMeal"><span>${SLOT_ICONS[e.slot]||'🍽️'}</span><div class="grow"><b>${esc(r.name)}</b><div class="tiny">${esc(e.slot)} · ${e.eat} ${e.eat===1?'porție':'porții'}</div></div></div>`:''}).join(''):'<div class="emptyCompact">Încă nu ai ales mesele pentru această zi.</div>'}<button class="btn primary block" onclick="startAdd(${chosenDay},'Prânz')">＋ Adaugă o masă</button></div><div class="homeTiles"><button class="homeTile peach" onclick="go('recipes')"><span>📖</span><b>Descoperă rețete</b><small>Caută după ingredient sau tip</small></button><button class="homeTile lilac" onclick="go('shopping')"><span>🛒</span><b>Lista săptămânii</b><small>Produse grupate pe categorii</small></button></div>`}

 return arr;}
function library(){return `<div class="eyebrow">Colecția ta personală</div><h1>Descoperă rețete <span class="friendlyEmoji">📚</span></h1><div class="filterPanel"><label class="fieldLabel" for="searchbox">Caută după nume sau ingredient</label><div class="searchWrap"><span>⌕</span><input id="searchbox" class="searchInput" type="search" value="${esc(search)}" placeholder="ex. pui, dovlecel, chia…" oninput="search=this.value;refreshResults()"></div><div class="fieldLabel">Alimentație</div><div class="libraryType filterChips">${[['all','Toate'],['post','🌿 De post'],['normal','🍽️ Normale']].map(([id,label])=>`<button data-kind="${id}" class="filterChip ${filter===id?'on':''}" onclick="setLibraryType('${id}')">${label}</button>`).join('')}</div><div class="filterGrid"><label class="fieldLabel">Tip de preparat <select class="field compact" onchange="uiKind=this.value;refreshResults()">${KIND_OPTIONS.map(([id,label])=>`<option value="${id}" ${id===uiKind?'selected':''}>${label}</option>`).join('')}</select></label><label class="fieldLabel">Timp de pregătire <select class="field compact" onchange="uiTime=this.value;refreshResults()"><option value="all">Oricât</option>${[15,30,45,60].map(n=>`<option value="${n}" ${uiTime===String(n)?'selected':''}>Până la ${n} min</option>`).join('')}</select></label><label class="fieldLabel">Ordonează <select class="field compact" onchange="uiSort=this.value;refreshResults()"><option value="az" ${uiSort==='az'?'selected':''}>Alfabetic A–Z</option><option value="za" ${uiSort==='za'?'selected':''}>Alfabetic Z–A</option><option value="quick" ${uiSort==='quick'?'selected':''}>Cele mai rapide</option><option value="favorites" ${uiSort==='favorites'?'selected':''}>Favorite întâi</option></select></label><label class="favoriteSwitch"><input type="checkbox" class="checkbox" ${uiFavOnly?'checked':''} onchange="uiFavOnly=this.checked;refreshResults()"> ♡ Doar favorite</label></div><p class="filterHint">Tipurile de preparate sunt sugestii bazate pe denu function setPickerType(type){pickerType=type;showAdd();let input=document.getElementById('pickerQuery');if(input)input.focus()}
function refreshPicker(){let p=document.getElementById('pickerResults');if(!p)return;p.innerHTML=pickerResults();queueMicrotask(hydratePhotos)}
function selectPickerRecipe(id){pickedRecipeId=id;let prior=document.getElementById('eatPortions')?.value||'1';document.getElementById('pickerResults').innerHTML=pickerResults();document.getElementById('pickerSelected').innerHTML=pickerSelected();if(document.getElementById('eatPortions'))document.getElementById('eatPortions').value=prior;queueMicrotask(hydratePhotos)}
function stepEat(delta){let el=document.getElementById('eatPortions');if(!el)return;el.value=String(Math.max(.5,Math.min(100,(Number(el.value)||1)+delta)));updatePickerButton()}
function updatePickerButton(){let b=document.getElementById('pickerConfirm'),n=Number(document.getElementById('eatPortions')?.value);if(b)b.disabled=!(n>0&&n<=100)}
function confirmAdd(){let id=pickedRecipeId,eat=Number(document.getElementById('eatPortions')?.value),r=getRec(id);if(!r||!Number.isFinite(eat)||eat<=0||eat>100)return alert('Alege o rețetă și un număr valid de porții.');if(dayType(addDay)==='post'&&r.type!=='post')return alert('Această zi este de post.');(state.plan[addDay]??=[]).push({id,eat,slot:document.getElementById('addSlot').value});save();hideModal();tab='plan';chosenDay=addDay;render()}
const SHOP_CATS=[['vegetables','🥬','Legume și verdețuri'],['fruits','🍓','Fructe'],['meat','🍗','Carne și pește'],['dairy','🥚','Lactate, ouă și alternative vegetale'],['grains','🍞','Cereale și panificație'],['legumes','🫘','Leguminoase și tofu'],['fats','🥑','Uleiuri, nuci și semințe'],['seasoning','🧂','Condimente și sosuri'],['other','🛍️','Altele']];
function ingredientCategory(name){let n=norm(name);
 if(/pui|curcan|vita|porc|carne|somon|ton|peste|cod|merluciu|sardine|crevet|sunca|bacon|ficat|ficate|nisetru|scrumbie|piept de rata|pastrav|macrou/.test(n))return 'meat';
 if(/iaurt|branza|lapte|smantana|mozzarella|cheddar|cascaval|parmezan|unt(?! de (arahide|migdale))|oua|oul|ou |galbenus|albus|chefir|kefir|ricotta|cottage/.test(n))return 'dairy';
 if(/cartof|ceapa|cepe|usturoi|morcov|ardei|rosie|tomat|castrav|varza|dovle|broccoli|conopid|spanac|salata verde|sfecla|vinete|telina|praz|loboda|patrunjel|marar|ciuperc|mazare verde|sparanghel|fasole verde|ridich|gulie|salată verde|rucola|porumb/.test(n))return 'vegetables';
 if(/mar(?!ar)|mere|banana|fruct|afine|capsun|zmeur|mango|ananas|portocal|lamaie|lime|kiwi|para|piersic|prun|curmale|visine|cirese|pepene/.test(n))return 'fruits';
 if(/tofu|linte|naut|fasole (boabe|alba|rosie|neagra)|boabe de fasole|edamame|soia|soia texturata|tempeh|hummus/.test(n))return 'legumes';
 if(/faina|orez|paste|spaghet|ovaz|fulgi|paine|lipie|wrap|pesmet|biscuit|cuscus|quinoa|bulgur|gris|foietaj|malai|tortilla|taitei|h risca|hrisca/.test(n))return 'grains';
 if(/ulei|semin|nuc|migdale|arahid|alune|fistic|caju|avocado|tahini|chia|susan|unt de (arahide|migdale)/.test(n))return 'fats';
 if(/sare|piper|boia|scortisoar|cimbru|busuioc|oregano|otet|mustar|sos |sosul|miere|vanilie|indulcitor|cacao|paprika|ghimbir|condiment|sirop|extract|zeama|coaja rasa|drojdie|praf de copt|curcuma|chimen/.test(n))return 'seasoning';
 return 'other';}
function aggregateShopping(){let map=new Map();for(let d=0;d<7;d++)for(let e of weeklyDay(d)){let r=getRec(e.id);if(!r)continue;for(let i of r.ingredients||[]){if(i.groupHeader)continue;let name=String(i.name||i.raw||'').trim(),unit=String(i.unit||'').trim(),key=(name+'|'+unit).toLowerCase().trim();if(!name)continue;let a=map.get(key)||{key,name,unit,qty:0,unknown:false,cat:ingredientCategory(name)};let q=Number(i.qty);if(i.qty!=null&&Number.isFinite(q)&&Number(r.portions)>0)a.qty+=q*Number(e.eat)/(Number(r.portions));else a.unknown=true;map.set(key,a)}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ro'))}
function formatShopQuantity(i){let q=i.qty>0?fmt(i.qty,2)+' '+esc(i.unit||'buc.'):'';if(i.unknown)return (q?q+' + ':'')+'verifică rețeta';return q||'după gust'}
function shopping(){let all=aggregateShopping(),count=all.filter(i=>state.checked[i.key]).length,display=all.filter(i=>!shoppingPendingOnly||!state.checked[i.key]);let sections=SHOP_CATS.map(([id,emoji,label])=>({id,emoji,label,items:display.filter(i=>i.cat===id),all:all.filter(i=>i.cat===id)})).filter(s=>s.items.length);return `<div class="eyebrow">Pregătită automat din meniul săptămânii</div><h1>Lista de cumpărături <span class="friendlyEmoji">🛒</span></h1><div class="shopSummary"><div class="row"><div><span class="tiny">PROGRESUL TĂU</span><div class="bigProgress">${count} <small>/ ${all.length} produse bifate</small></div></div><div class="shopSummaryIcon">🧺</div></div><div class="progress"><span style="width:${all.length?count/all.length*100:0}%"></span></div><p class="tiny">Am grupat ingredientele pe raioane. Cantitățile sunt calculate pentru porțiile planificate.</p></div><div class="shopTools"><label class="favoriteSwitch"><input type="checkbox" class="checkbox" ${shoppingPendingOnly?'checked':''} onchange="shoppingPendingOnly=this.checked;render()"> Arată doar ce lipsește</label><button class="btn ghost" onclick="clearChecks()">Resetează bifele</button></div>${sections.map(s=>`<details class="shopSection" ${!shopOpen.has(s.id)?'open':''} ontoggle="rememberShopSection('${s.id}',this.open)"><summary><div class="row start"><span class="shopEmoji">${s.emoji}</span><div><b>${s.label}</b><div class="mini">${s.all.filter(x=>state.checked[x.key]).length}/${s.all.length} bifate</div></div></div><span class="sectionCount">${s.items.length} <span class="chevron">⌄</span></span></summary><div class="shopBody">${s.items.map(i=>`<label class="shopItem ${state.checked[i.key]?'done':''}"><input type="checkbox" class="checkbox" ${state.checked[i.key]?'checked':''} onchange="checkItem('${encodeURIComponent(i.key)}',this.checked)"><span class="shopName">${esc(i.name)}</span><span class="shopQty ${i.unknown?'needsReview':''}">${formatShopQuantity(i)}</span></label>`).join('')}</div></details>`).join('')}${!all.length?'<div class="empty">Adaugă rețete în planificator ca să generezi lista.</div>':!display.length?'<div class="empty">🎉 Ai bifat toate produsele!</div>':''}<button class="btn primary block" ${!all.length?'disabled':''} onclick="copyShopping()">📋 Copiază lista de cumpărături</button><p class="filterHint">Ingredientele cu cantități neclare sunt marcate „verifică rețeta”, nu estimate automat.</p>`}
function rememberShopSection(id,open){if(open)shopOpen.delete(id);else shopOpen.add(id)}
function checkItem(key,v){state.checked[decodeURIComponent(key)]=v;save();render()}
function clearChecks(){state.checked={};save();render()}
async function copyShopping(){const a=aggregateShopping().filter(i=>!state.checked[i.key]);let lines=[];for(let [id,emoji,label] of SHOP_CATS){let group=a.filter(i=>i.cat===id);if(group.length){lines.push(emoji+' '+label);for(let i of group)lines.push('• '+i.name+': '+formatShopQuantity(i).replace(/<[^>]+>/g,''));lines.push('')}}if(!a.length)return alert('Nu sunt produse rămase de cumpărat.');try{await navigator.clipboard.writeText(lines.join('\n'));alert('Lista grupată a fost copiată.')}catch{alert('Copierea nu este disponibilă în acest browser.')}}

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));render();
</script></body></html>
